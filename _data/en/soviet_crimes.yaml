lead: >
  The Soviet Union continued [Russian Empire](/empire_crimes/)'s conquest and terror on an industrial scale.
  [Mass murders](#pogroms-during-the-russian-civil-war),
  [famines](#holodomor),
  and [deportations](#operation-priboi)
  were conducted against
  [Ukrainians](#executed-renaissance),
  [Crimean Tatars](#deportation-of-the-crimean-tatars),
  [Latvians](#latvian-operation-of-the-nkvd),
  [Lithuanians](#soviet-deportations-from-lithuania),
  [Estonians](#estonian-operation-of-the-nkvd),
  [Finns](#finnish-operation-of-the-nkvd),
  [Poles](#treaty-of-riga),
  [Belarussians](#1937-mass-execution-of-belarusians),
  [Georgians](#soviet-invasion-of-georgia),
  [Kazakhs](#kazakh-famine-of-1930-1933),
  [Jews](#night-of-the-murdered-poets),
  [Armenians](#black-january),
  [Greeks](#deportation-of-the-soviet-greeks),
  [Germans](#deportation-of-soviet-germans-1941-1942),
  [Hungarians](#hungarian-revolution-of-1956),
  [Mongolians](#stalinist-repressions-in-mongolia),
  [Kalmyks](#deportation-of-the-kalmyks),
  [Chechens and Ingushes](#operation-lentil-caucasus),
  [Afghans](#soviet-afghan-war),
  [Balkars](#deportation-of-the-balkars),
  [Meskhetian Turks](#deportation-of-the-meskhetian-turks),
  [Koreans](#deportation-of-koreans-in-the-soviet-union),
  and [Japanese](#gegenmiao-massacre).
entries:
  opposition-to-the-russian-orthodox-church-during-the-russian-civil-war: >
    During the Russian Civil War, the Bolsheviks killed at least 1 metropolitan, 18 bishops, 102
    priests, 154 deacons, and 94 monks and nuns between June 1918 and January 1919. They also
    attacked and desecrated numerous monasteries and churches.
  makhnovshchina: >
    The Makhnovshchina, an anarchist-communist movement, faced severe repression from the
    Bolsheviks, resulting in the death of 200,000 Ukrainian peasants.
  pogroms-during-the-russian-civil-war: >
    From 1918 to 1920, over 1,300 pogroms occurred in Ukraine, resulting in between 35,000 and
    250,000 deaths. 50,000 to 300,000 children were orphaned.
  basmachi-movement: >
    The Basmachi movement, an uprising against Russian and Soviet rule in Central Asia, led to the
    Red Army carrying out a massacre of up to 25,000 people in Kokand in 1918.
  red-terror: >
    The Red Terror, initiated by the Bolsheviks in September 1918, aimed to suppress political
    dissent and opposition during the Russian Civil War. Between 1918 and 1922, the campaign led to
    the execution of at least 50,000 individuals, marking the beginning of the Gulag system and
    causing thousands more deaths due to harsh conditions in labor camps.
  executed-renaissance: >
    The Executed Renaissance refers to the elimination of Ukrainian artists and intellectuals during
    the 1920s and early 1930s, with 45 intellectuals convicted, and over 30,000 arrested, deported,
    or executed following Stalin's rise and the Great Terror of 1937-38.
  tambov-rebellion: >
    The Tambov Rebellion, from 1920-1922, was a significant peasant uprising against forced grain
    requisitions by the Bolshevik government, leading to brutal suppression that killed around
    15,000 and arrested 100,000 people.
  russian-famine-of-1921-1922: >
    The Russian famine of 1921-1922, affecting the Volga and Ural regions, killed an estimated 5,000,000
    people due to drought, war, economic policies, and disease outbreaks. The Bolshevik
    government's requisitioning of supplies from peasants without adequate compensation worsened the
    crisis.
  ussr-anti-religious-campaign-1921-1928: >
    The USSR anti-religious campaign (1921-1928) aimed to eliminate religion through propaganda and
    persecution. Approximately 8,100 clergy, monks, and nuns were murdered, churches and monasteries
    were systematically closed, and the Orthodox Church lost its ability to train new clergy by
    1928.
  soviet-invasion-of-georgia: >
    The Soviet invasion of Georgia in February 1921, led by Stalin and Ordzhonikidze, culminated in
    the execution of 12,578 Georgians and the exile of over 20,000 to Siberia in 1924.
  treaty-of-riga: >
    The Treaty of Riga ended the Polish-Soviet War, incorporating 4,000,000 Ukrainians and over 1,000,000 Belarusians into Poland, leading to ethnic tensions. Ethnic Poles within Soviet borders
    faced severe repression, with at least 111,000 executed in 1937/38.
  ussr-anti-religious-campaign-1928-1941: >
    Between 1928 and 1941, the Soviet Union enforced an anti-religious campaign that led to the
    closure of nearly all churches and the imprisonment and death of up to 200,000 clergy, severely
    curtailing religious practice and expression.
  shakhty-trial: >
    The Shakhty Trial, with 11 of 53 accused engineers sentenced to death, replacing skilled
    professionals with politically aligned youth.
  genocide-of-the-ingrian-finns: >
    The Soviet Union's actions against the Ingrian Finns, including deportations, imprisonments, and
    killings, resulted in the population declining from 140,000-160,000 to approximately 19,000 by
    today. Over 100,000 Russian Finns were deported without trial, and tens of thousands died in
    labor camps.
  dekulakization: >
    Dekulakization, a campaign against so-called kulaks in the Soviet Union, led to mass arrests,
    executions, and deportations, with estimates suggesting between 530,000 and 600,000 deaths from
    1930 to 1933.
  kazakh-famine-of-1930-1933: >
    The Kazakh famine of 1930-1933, resulting from Soviet collectivization policies, led to the
    deaths of an estimated 1,300,000 to 2,300,000 people, with 38-42% of all Kazakhs perishing.
  holodomor: >
    The Holodomor, a man-made famine in Ukraine from 1932 to 1933, resulted in between 3,500,000 and 5,000,000
    deaths due to Stalin's policies of high grain quotas and low food rations.
  great-purge: >
    The Great Purge, conducted from 1936 to 1938, involved the execution or imprisonment of hundreds
    of thousands of Soviet citizens suspected of political dissent. Estimates suggest between
    700,000 to 1,200,000 people were killed.
  vinnytsia-massacre: >
    Over 9,400 people were secretly executed in Vinnytsia by the Soviet NKVD in 1937-1938.
  nkvd-order-no-00439: >
    NKVD Order № 00439, enacted in 1937, led to the arrest of around 800 German citizens and former
    citizens, and sentenced approximately 55,005 Soviet citizens of German descent, with 41,898
    receiving death sentences.
  nkvd-order-no-00447: >
    NKVD Order No. 00447 led to the execution of 386,798 Soviet citizens
    by 1938.
  nkvd-order-no-00485: >
    NKVD Order No. 00485, issued in 1937, was an anti-Polish ethnic cleansing campaign targeting
    139,815 individuals, with 111,071 condemned to death without trial. This operation was part of
    broader national operations affecting multiple ethnic groups, including Germans, Latvians,
    Finns, Estonians, Romanians, Greeks, and others.
  polish-operation-of-the-nkvd: >
    The NKVD's Polish Operation resulted in the sentencing of 139,835 people and the execution of
    111,091 Poles, targeting Poles and others perceived as disloyal, leading to family deportations
    and the annihilation of the Polish minority.
  deportation-of-koreans-in-the-soviet-union: >
    In 1937, 172,000 Soviet Koreans were forcibly transferred 6,400 km to Central Asia, with up to
    50,000 dying due to harsh conditions.
  stalinist-repressions-in-mongolia: >
    Stalinist repressions in Mongolia, between 1937 and 1939, led to the execution of between 20,000
    to 35,000 people.
  1937-mass-execution-of-belarusians: >
    In October 1937, more than 100 Belarusian intellectuals were executed by Soviet authorities. 103
    Belarusians killed, with over 100,000 falling victim to broader repressions between 1937 and
    1938.
  latvian-operation-of-the-nkvd: >
    During Stalin's Great Purge, the NKVD arrested and executed thousands of Latvians, with 16,573
    out of 22,369 convicted Latvians shot, and cultural institutions were dismantled.
  estonian-operation-of-the-nkvd: >
    During the Great Purge (1937-1938), the NKVD conducted the Estonian Operation, sentencing 5,680
    individuals to various punishments, with 4,672 receiving death sentences.
  finnish-operation-of-the-nkvd: >
    The Finnish Operation of the NKVD arrested, deported and executed Soviet Finns during the Great
    Purge of 1937-1938. Finns were 3% of the Karelian ASSR's population but more than 40% of its
    Great Terror victims; of nearly 6,200 Finnish citizens convicted, more than 4,700 were executed.
  soviet-invasion-of-poland: >
    The Soviet invasion of Poland on 17 September 1939 led to the capture
    of 320,000 Poles and initiated a campaign of mass persecution. Between 1939 and 1941, the Soviet
    NKVD deported hundreds of thousands of people from eastern Poland.
  katyn-massacre: >
    In 1940, the Soviet secret police executed nearly 22,000 Polish military officers and
    intelligentsia in Katyn.
  soviet-deportations-from-bessarabia-and-northern-bukovina: >
    Between 1940 and 1951, the Soviet Union deported 46,000 people from the Moldavian Soviet
    Socialist Republic.
  soviet-deportations-from-latvia: >
    The Soviet government deported approximately 60,000 Latvians to remote and inhospitable regions
    of the Soviet Union.
  soviet-deportations-from-lithuania: >
    Between 1941 and 1952, the Soviet Union forcibly deported at least 130,000 Lithuanians, 70% of
    whom were women and children, to labor camps. Of these deportees, approximately 28,000 died in
    exile due to harsh living conditions.
  nkvd-prisoner-massacres-in-lviv: >
    Between 3,500 and 7,000 prisoners in Lviv, including Ukrainians, Poles, and Jews, were brutally
    executed by Soviet NKVD officers in June 1941, as the Soviets retreated from advancing German
    forces.
  nkvd-prisoner-massacre-in-lutsk: >
    On June 23, 1941, as the German forces advanced during World War II, the Soviet NKVD executed
    about 2,000 political prisoners in Lutsk.
  anglo-soviet-invasion-of-iran: >
    The 1941 Anglo-Soviet invasion of Iran led to over 200 civilian casualties in bombing raids.
  deportation-of-soviet-germans-1941-1942: >
    During WWII, the Soviet government deported at least 846,340 Germans from the Volga region and
    other parts of the western Soviet Union to Siberia and Kazakhstan due to fears of collaboration
    with Nazi Germany, causing 228,800 fatalities.
  deportation-of-the-soviet-greeks: >
    Stalin's regime forcibly uprooted around 70,000 to 80,000 Greeks from the Black Sea coast
    between 1942 and 1949, with at least 15,000 dying as a result.
  deportation-of-the-karachays: >
    The Soviet government deported nearly 70,000 Karachays in November 1943, resulting in at least
    13,000 deaths. Despite 20,000 Karachays serving in the Red Army, the government falsely accused
    them of collaborating with the German forces, leading to their forced relocation to labor camps
    in Central Asia.
  deportation-of-the-kalmyks: >
    Over 93,000 Kalmyks were forcibly relocated to Siberia in December 1943 under false accusations
    of Axis collaboration, leading to more than 16,000 deaths, despite 23,000
    Kalmyks serving in the Red Army.
  operation-lentil-caucasus: >
    In 1944, 496,000 Chechens and Ingush were forcibly deported by the Soviet government, with
    123,000-200,000 dying during the transit due to harsh conditions.
  deportation-of-the-balkars: >
    In 1944, 37,713 Balkars were forcibly deported from their homeland in 1 day, with 7,600-11,000
    deaths, or 20-25% of their ethnic group, as a result of the Soviet government's actions.
  deportation-of-the-crimean-tatars: >
    In 1944, at least 191,044 Crimean Tatars were deported by Soviet authorities, resulting in the
    deaths of nearly 8,000 during transit and tens of thousands more due to harsh living conditions.
  deportation-of-the-meskhetian-turks: >
    Between 92,307 and 94,955 Meskhetian Turks were forcibly deported to Central Asia in 1944,
    resulting in up to 50,000 deaths. The policy was part of a larger Soviet plan to remove Muslim
    minorities from the Caucasus, leaving the Meskhetian Turks stateless and scattered across 7
    countries.
  soviet-deportations-from-estonia: >
    Between 1945 and 1953, over 35,000 people, mostly women and children, were forcibly deported
    from Estonia to remote areas of the Soviet Union, constituting a crime against humanity as
    declared by the European Court of Human Rights. Over 70% of those deported in 1949 were women
    and children under 16.
  soviet-annexation-of-transcarpathia: >
    The Soviet Union annexed Transcarpathia, causing the emigration of over 120,000 people and
    displacing about 450,000 inhabitants from Czechoslovakia.
  augustow-roundup: >
    The Augustów roundup, conducted by Soviet forces in 1945, led to the arrest of over 2,000 Polish
    anti-communists, with 600 people executed.
  soviet-invasion-of-south-sakhalin: >
    The Soviet invasion of South Sakhalin resulted in approximately 5,000 to 6,000 Japanese military
    and civilian casualties and the capture of around 18,202 soldiers, who were sent to labor camps
    in Siberia. Additionally, at least 100,000 Japanese civilians fled to avoid Soviet control.
  gegenmiao-massacre: >
    During the Soviet invasion of Manchuria in August 1945, the Red Army massacred over 1,000
    Japanese women and children in Gegenmiao, shooting them, running them over with tanks, and
    bayoneting them after they raised a white flag.
  operation-vistula: >
    Operation Vistula involved the forced resettlement of nearly 150,000 Ukrainians and others from
    southeastern Poland to the north and west in 1947, with Soviet approval, to eliminate support
    for the Ukrainian Insurgent Army. Over 126,000 Ukrainians were apprehended by the NKVD between
    1945 and 1947, and nearly 32,000 were killed.
  operation-priboi: >
    Operation Priboi involved the deportation of over 90,000 people from the Baltic states to
    Siberia in 1949, primarily women and children under 16, to facilitate collectivization and
    eliminate resistance. By 1950, more than 4,000 of deportees, including 2,080 children, had died.
  operation-north: >
    Operation North, authorized by the USSR Ministry of State Security, led to the forced
    deportation of 9,973 Jehovah's Witnesses and their families to Siberia in 1951, where they were
    classified as "special settlers" and faced severe persecution.
  operation-osen: >
    Operation Osen in 1951 involved the deportation of over 20,000 people from Lithuania to remote
    Soviet regions.
  night-of-the-murdered-poets: >
    On August 12, 1952, 13 Soviet Jews, including Yiddish writers from the Jewish Anti-Fascist
    Committee, were executed in Moscow under false charges of espionage and treason.
  east-german-uprising-of-1953: >
    The 1953 East German uprising involved over 1,000,000 people across 700 localities and led to
    the deaths of over 125 civilians after Soviet forces suppressed the protests.
  1956-georgian-demonstrations: >
    Soviet Army killed at least 21 people and injured 55 in response to 1956 Georgian
    demonstrations.
  hungarian-revolution-of-1956: >
    The Hungarian Revolution of 1956, lasting 15 days, was crushed by Soviet forces on November 7,
    1956, resulting in 2,500 Hungarian deaths and 700 Soviet deaths. The uprising led to the
    imprisonment of 22,000 people and the execution of 229 individuals, with nearly a quarter of a
    million Hungarians fleeing the country.
  ussr-anti-religious-campaign-1958-1964: >
    During Khrushchev's anti-religious campaign (1958-1964), over 50,000 clergy were executed, and
    the number of functioning Orthodox churches was reduced from over 20,000 to 6,850 by 1972.
  novocherkassk-massacre: >
    The Novocherkassk massacre, where Soviet troops fired on unarmed demonstrators,
    resulted in 24 deaths and 87 severe injuries.
  soviet-afghan-war: >
    The Soviet-Afghan War, from 1979 to 1989, resulted in the deaths of between 1,000,000 and 3,000,000 Afghans
    and displaced 5,500,000 refugees. Soviet forces committed numerous atrocities, including targeting civilians and
    destroying infrastructure.
  rauzdi-massacre: >
    On June 30, 1983, the Soviet Army killed 24 people in Rauzdi, Afghanistan, including 23
    civilians, in retaliation for a confrontation with an 18-year-old anti-communist resistance
    member.
  kulchabat-bala-karz-and-mushkizi-massacre: >
    The Soviet Army killed up to 360 civilians, including 20 girls and over a dozen elderly, in
    3 Afghan villages as a retaliatory measure for the destruction of Soviet military vehicles.
    Eyewitnesses reported brutal killings, including grenades thrown into rooms filled with women
    and children.
  kunduz-massacre: >
    During the Kunduz massacre, the Soviet Army killed around 250 civilians in retaliation for
    Mujahideen resistance. The atrocities included looting, destruction, rape, and the systematic
    execution of villagers.
  laghman-massacre: >
    The Laghman massacre involved Soviet forces killing between 500 and 1,000 civilians, employing
    napalm bombs.
  black-january: >
    In January 1990, Soviet troops entered Baku to suppress anti-Soviet and anti-Armenian
    sentiments, resulting in 147 civilian deaths and 800 injuries.
