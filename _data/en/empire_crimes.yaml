lead: >
  The Russian Empire was built by conquest and kept by terror. It took
  [Siberia](#russian-conquest-of-siberia) from indigenous people, cleared the [North
  Caucasus](#caucasian-war) of the [Circassians](#circassian-genocide), executed and exiled
  [Poles](#january-uprising), and organised pogroms against [Ukrainians, Jews, and Roman Catholics](#koliivshchyna).
closer: >
  See also: [Soviet Union](/soviet_crimes/) crimes, [Russian Federation](/federation_crimes/) crimes.
entries:
  russian-conquest-of-siberia: >
    The Russian conquest of Siberia involved significant violence and coercion against indigenous
    populations, with over 80% of the Tungus and Yakut populations dying from smallpox brought by
    Russian explorers between 1650s and 1690s.
  koliivshchyna: >
    The Koliivshchyna rebellion in Right-bank Ukraine in 1768, fueled by Russian support,
    led to the massacre of an estimated 100,000 to 200,000 victims, including
    Poles, Jews, and Roman Catholics.
  caucasian-war: >
    The Caucasian War, spanning the 19th century, involved the Russian Empire's conquest of the
    North Caucasus, causing over 700,000 civilian deaths.
  january-uprising: >
    The January Uprising against Russian imperial rule in Poland resulted in severe reprisals,
    including the execution of 396 persons and the exile of 18,672 to Siberia. Over 60,000 people
    were imprisoned and exiled.
  circassian-genocide: >
    The Russian Empire carried out systematic mass killings and ethnic cleansing, and forcibly
    displaced between 95% and 97% of the Circassian people, resulting in up to 1,500,000 deaths.
  russo-turkish-war-1877-1878: >
    The Russo-Turkish War (1877-1878) was marked by significant
    civilian casualties, including the massacre of 14,000 Bulgarians and the forced migration of up
    to 561,844 Muslims.
  russian-invasion-of-manchuria: >
    The Russian invasion of Manchuria resulted in high casualties (at least in the thousands), with
    Russian forces killing many Manchus and burning their villages, causing thousands to flee.
  kishinev-pogrom: >
    The Kishinev pogrom in 1903 resulted in 47 Jews killed, 92 severely wounded, and 500 injured,
    with over 1,500 homes and 600 stores damaged or pillaged.
  kyiv-pogrom-1905: >
    The 1905 Kyiv pogrom resulted in the massacre of approximately 100 Jews and serious injury to at
    least 300 more.
  odessa-pogroms: >
    The Odesa pogroms, marked by anti-Jewish riots and attacks, caused over 500 Jewish casualties,
    300 injuries, and widespread property destruction.
  bialystok-pogrom: >
    The Białystok pogrom, orchestrated by Russian authorities, resulted in the deaths of 88 people,
    including 82 Jews, and the plunder of 169 shops and houses.
  russian-occupation-of-tabriz: >
    The Russian occupation of Tabriz (1909-1918) lead to significant civilian casualties.
    1,200 civilians and revolutionaries were executed during the occupation.
  central-asian-revolt-of-1916: >
    The Central Asian revolt of 1916, sparked by forced conscription into the Russian military, led
    to the death of 100,000 to 500,000 Central Asians due to violence, disease, and famine.
