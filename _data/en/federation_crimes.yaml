lead: >
  The Russian Federation retains the (Soviet Union)[/soviet_crimes/]’s imperial ambitions.
  It continues its atrocious conquest towards
  [Ossetians](#south-ossetia-war-1991-1992),
  [Chechens](#second-chechen-war),
  [Georgians](#russo-georgian-war),
  and [Ukrainians](#russo-ukrainian-war),
  committing
  [mass murders](#izium-mass-graves),
  [executions](#novye-aldi-massacre),
  [torture](#bucha-massacre)
  targeting
  [prisoners or war](#olenivka-prison-massacre)
  and [civillians](#siege-of-mariupol).
closer: >
  See also: [__Russian Empire__](/empire_crimes/) crimes, [__Soviet Union__](/soviet_crimes/) crimes.
entries:
  south-ossetia-war-1991-1992: >
    The 1991-1992 South Ossetia War, involving Russian-backed Ossetian
    separatists, resulted in around 1,000 deaths and displaced over 63,000 people.
  battle-of-grozny-1994-1995: >
    The Russian invasion of Grozny, from December 1994 to March 1995, involved heavy artillery and
    air strikes, leading to significant civilian casualties, estimated between 5,000 to 30,000
    deaths.
  samashki-massacre: >
    Russian forces killed over 100 civilians in Samashki in April 1995, shooting and burning them
    alive, and destroying the village, including the school.
  second-chechen-war: >
    The Second Chechen War (1999-2009) saw Russian forces deploy banned weapons and indiscriminately
    target civilians, leading to up to 25,000 civilian deaths and 5,000 forced disappearances.
  1999-russian-apartment-bombings: >
    The 1999 Russian apartment bombings killed over 300 and injured over 1,000, instigating fear to
    justify upcoming the Second Chechen War for civillians. Independent investigations suggest
    Russian state security orchestrated the attacks to escalate conflict and boost Putin's
    popularity.
  battle-of-grozny-1999-2000: >
    The Battle of Grozny (1999-2000) involved extensive Russian bombardment, leading to Grozny's
    designation as the most destroyed city on Earth. Between 5,000 and 8,000 civilians were killed,
    and severe human rights violations occurred.
  bombing-of-katyr-yurt: >
    Russian forces bombed Katyr-Yurt and a refugee convoy on February 4, 2000, killing at least 363
    civilians.
  novye-aldi-massacre: >
    Russian forces executed up to 82 civilians in Novye Aldi during a cleansing operation on
    February 5, 2000, accompanied by looting, rape, and arson.
  komsomolskoye-massacre: >
    During the Komsomolskoye massacre, about 72 surrendered Chechen combatants were almost entirely
    killed or disappeared after detention and torture.
  moscow-theater-hostage-crisis: >
    The Moscow theater hostage crisis, involving 912 hostages taken by 40 Chechen terrorists, ended
    with 132 hostage deaths after Russian forces used an undisclosed chemical agent.
  beslan-school-siege: >
    Beslan school siege, lasting 3 days in 2004, involved over 1,100 hostages, including 777
    children, leading to 334 deaths, 186 of them children.
  russo-georgian-war: >
    The 2008 Russo-Georgian War, initiated by Russia, resulted in the displacement of 192,000 people
    and widespread civilian casualties.
  russo-ukrainian-war: >
    The Russian invasion of Ukraine began in February 2014 and is ongoing. Estimated casualties are
    between 1,274,000 and 2,000,000, of which a minimum of 20,000 civilians killed and 50,000
    wounded.
  malaysia-airlines-flight-17: >
    Malaysia Airlines Flight 17 was shot down by a Buk missile from a launcher associated with
    Russian-backed separatists in eastern Ukraine, killing all 298 passengers and crew.
  battle-of-debaltseve: >
    The Battle of Debaltseve, part of the war in Donbas, resulted in over 267 Ukrainian deaths and
    severe humanitarian suffering, with nearly 500 civilian corpses found post-battle.
  siege-of-mariupol: >
    The Russian siege of Mariupol lasted nearly 3 months, resulting in the city's occupation and
    the death of at least 1,348 civilians, with the true toll estimated to be thousands higher. The
    siege also caused the destruction of 90% of the city's residential buildings, while Russian
    forces blocked humanitarian aid, committing numerous war crimes.
  bombing-of-borodianka: >
    On 1–2 March 2022, Russian airstrikes destroyed 8 multi-storey residential buildings in
    Borodianka, killing 40-80 civilians.
  kharkiv-government-building-airstrike: >
    On 1 March 2022, two Russian cruise missiles struck the Kharkiv Regional State Administration
    building and nearby Freedom Square, killing 29 people and injuring more than 35.
  3-march-2022-chernihiv-bombing: >
    On 3 March 2022, Russian aircraft bombed a residential area in Chernihiv, killing 47 and
    injuring 18, while civilians were going about their daily activities.
  irpin-refugee-column-shelling: >
    On 6 March 2022, Russian forces repeatedly shelled an intersection in Irpin being used by
    civilians fleeing toward Kyiv, killing 8.
  9-march-2022-mariupol-hospital-3-attack: >
    On 9 March 2022, Russian forces bombed Maternity Hospital No. 3 in Mariupol, killing at least 4
    people and injuring at least 16.
  bucha-massacre: >
    The Bucha massacre involved the mass murder of Ukrainian civilians by Russian forces, with 458
    bodies recovered, including 9 children. The UN documented at least 73 unlawful killings, and
    Human Rights Watch confirmed war crimes by Russian troops, including executions and torture.
  stara-krasnianka-care-house-attack: >
    On 11 March 2022, Russia-affiliated forces shelled a care home at Stara Krasnianka with heavy
    weapons while 71 disabled patients and 15 staff remained inside. A fire followed and 56
    civilians died.
  16-march-2022-chernihiv-breadline-attack: >
    On 16 March 2022, Russian forces attacked civilians queuing for bread in Chernihiv, killing 18
    and injuring 26.
  mariupol-theatre-airstrike: >
    The Russian Armed Forces bombed the Mariupol theatre on March 16, 2022, used as a civilian air
    raid shelter, causing up to 600 deaths.
  mykolaiv-government-building-missile-strike: >
    On 29 March 2022, Russian forces launched a cruise missile at the Mykolaiv Regional State
    Administration building, destroying roughly half of the structure and triggering fires. The
    strike killed 37 people and injured 34.
  kramatorsk-railway-station-attack: >
    On April 8, 2022, a Russian missile strike hit Kramatorsk's railway station, killing 63
    civilians, including 9 children, and wounding 150.
  bilohorivka-school-bombing: >
    On 7 May 2022, Russian forces bombed a school in Bilohorivka where about 90 people were
    sheltering in the basement. The strike caused a fire and trapped people inside. Up to 60 civilians died.
  kremenchuk-shopping-mall-attack: >
    On June 27, 2022, Russian missiles hit the Kremenchuk shopping mall, killing at least 20 people
    and injuring 59.
  serhiivka-missile-strike: >
    The Russian missile strike in Serhiivka on July 1, 2022, killed at least 21 civilians and
    injured 38, including 6 children.
  july-2022-chasiv-yar-missile-strike: >
    On 9 July 2022, Russian forces fired Uragan missiles at residential apartment buildings in
    Chasiv Yar, killing at least 48 people.
  vinnytsia-strikes-2022-present: >
    On July 14, 2022, Russian naval forces launched Kalibr missiles at central Vinnytsia, striking a
    medical center and the House of Officers, killing 28+ and injuring 202+ civilians.
  olenivka-prison-massacre: >
    Russian forces shelled a Ukrainian prison in Olenivka, killing 53 Ukrainian prisoners of war and
    wounding 75-130, with independent investigations pointing to Russia's responsibility and Russian
    refusal to cooperate with UN investigations.
  kharkiv-dormitories-missile-strike: >
    On 17–18 August 2022, Russian forces struck residential dormitories in Kharkiv with missiles,
    killing 25 people, and injuring 44.
  chaplyne-railway-station-attack: >
    On 24 August 2022, Russian forces carried out a missile strike on Chaplyne, killing 25 people
    and injuring 31.
  izium-mass-graves: >
    After Ukrainian forces recaptured Izium during the Kharkiv counteroffensive, 447 bodies were
    discovered in mass graves, including 414 civilians (215 women, 194 men, 5 children) and 22
    servicemen.
  kupiansk-civilian-convoy-shelling: >
    On 25 September 2022, Russian soldiers attacked a civilian evacuation convoy near Kupiansk,
    killing 26 and allowing 22 to escape while they were fleeing the city.
  zaporizhzhia-civilian-convoy-attack: >
    On 30 September 2022, Russian forces launched missiles at a civilian convoy near Zaporizhzhia as
    people were gathering to travel into Russian-occupied territory, killing 32 and injuring
    approximately 88.
  2022-zaporizhzhia-residential-building-airstrike: >
    On 9 October 2022, Russian forces launched missiles at a residential area in Zaporizhzhia,
    destroying an apartment building, killing 13 and injuring 89.
  2023-dnipro-residential-building-airstrike: >
    On 14 January 2023, Russian forces struck a 9-storey apartment building in Dnipro with a
    Kh-22 missile, killing 46 and injuring 80 civilians.
  april-2023-sloviansk-airstrike: >
    On 14 April 2023, Russian missiles struck residential buildings in Sloviansk during Orthodox
    Good Friday, killing 15 civilians, including a child, and injuring 24.
  2023-uman-missile-strike: >
    On 28 April 2023, Russian forces struck a residential apartment building in Uman with a Kh-101
    cruise missile, killing 23 civilians and injuring 9.
  destruction-of-the-kakhovka-dam: >
    Russian forces breached the Kakhovka Dam on June 6, 2023, causing catastrophic flooding
    downstream. At least 59 were officially reported dead, with potential casualties reaching into
    the hundreds.
  2023-kramatorsk-restaurant-missile-strike: >
    On 27 June 2023, Russian forces launched 2 missiles at Kramatorsk, hitting a crowded civilian
    restaurant and killing 13, including 4 children, while 65 were injured.
  lyman-cluster-bombing: >
    On 8 July 2023, Russian forces used Smerch cluster munitions against a residential area in
    central Lyman, killing 9 and injuring 13 civilians.
  2023-pokrovsk-missile-strike: >
    On 7 August 2023, Russian forces struck Pokrovsk twice with Iskander missiles, killing 10 and
    injuring 88, including emergency personnel who had arrived at the first impact site.
  august-2023-chernihiv-missile-strike: >
    On August 19, 2023, a Russian Iskander-M missile struck central Chernihiv near Taras Shevchenko
    Theatre, killing 7 and injuring 144+, while an exhibition involving civilians was taking place.
  hroza-missile-attack: >
    On October 5, 2023, a Russian Iskander missile struck a café in Hroza during a memorial
    gathering for a Ukrainian soldier, killing 59 civilians and injuring 7.
  volnovakha-massacre: >
    On 27 October 2023, two Russian soldiers allegedly entered a civilian family's home in occupied
    Volnovakha and killed all 9 members of the Kapkanets family, including children aged 5 and 9.
    The victims were reportedly shot after refusing to surrender their home for use by a Russian
    military unit.
  2024-pokrovsk-missile-strike: >
    On 6 January 2024, Russian forces launched a missile strike on a residential area in Pokrovsk,
    killing 12 people, including 6 children, and injuring 10.
  15-march-2024-odesa-missile-strikes: >
    On March 15, 2024, Russian forces struck Odesa, killing 21 and injuring 74.
  25-may-2024-kharkiv-missile-strikes: >
    On 25 May 2024, Russian forces struck Kharkiv, including the Epicentr K hypermarket, killing 19
    and injuring 65+.
  8-july-2024-russian-strikes-on-ukraine: >
    On 8 July 2024, Russian strikes across Ukraine killed 47 and injured about 170, with a missile
    hitting the Okhmatdyt children's hospital in Kyiv.
  september-2024-poltava-strike: >
    On September 3, 2024, Russian missiles hit a military institute and hospital in Poltava,
    Ukraine, killing at least 59 and injuring 328.
  2025-sumy-airstrike: >
    On 13 April 2025, Russian ballistic missiles struck central Sumy during religious services,
    killing 35, including 2 children, and injuring 129, with 15 of the injured being children.
  2025-yarova-attack: >
    On 9 September 2025, Russian forces struck Yarova with a glide bomb while pensioners were
    gathering to receive their pensions, killing 25 and injuring 19.
  2025-ternopil-strike: >
    On 19 November 2025, Russian forces carried out a large combined missile and drone
    attack on Ternopil, striking residential areas and two apartment buildings. The attack killed at
    least 38 civilians, including 8 children, and injured 99 people.
