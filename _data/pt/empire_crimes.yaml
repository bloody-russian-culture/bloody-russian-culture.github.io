lead: >
  O Império Russo foi construído pela conquista e mantido pelo terror. Tomou
  [Sibéria](#russian-conquest-of-siberia) dos povos indígenas, expulsou os
  [Cáucaso do Norte](#caucasian-war) dos [circassianos](#circassian-genocide), executou e exilou
  [poloneses](#january-uprising) e organizou pogroms contra [ucranianos, judeus e católicos romanos](#koliivshchyna).
entries:
  russian-conquest-of-siberia: >
    A conquista russa da Sibéria envolveu violência e coação significativas contra as populações indígenas,
    com mais de 80% das populações tungús e iacutas a morrerem de varíola trazida pelos exploradores russos entre as décadas de 1650 e 1690.
  koliivshchyna: >
    A rebelião de Koliivshchyna na Ucrânia a partir da margem direita em 1768, alimentada pelo apoio russo,
    levou ao massacre de cerca de 100,000 a 200,000 vítimas, incluindo
    polacos, judeus e católicos romanos.
  caucasian-war: >
    A Guerra do Cáucaso, que se estendeu pelo século XIX, envolveu a conquista do Norte do Cáucaso pelo Império Russo,
    provocando mais de 700,000 mortes de civis.
  january-uprising: >
    A Revolta de Janeiro contra o domínio imperial russo na Polónia resultou em severas represálias,
    incluindo a execução de 396 pessoas e o exílio de 18,672 para a Sibéria. Mais de 60,000 pessoas
    foram presas e exiladas.
  circassian-genocide: >
    O Império Russo levou a cabo assassinatos em massa sistemáticos e limpeza étnica, e deslocou à força
    entre 95% e 97% do povo circassiano, resultando em até 1,500,000 mortes.
  russo-turkish-war-1877-1878: >
    A Guerra Russo-Turca (1877-1878) foi marcada por significativas
    baixas civis, incluindo o massacre de 14,000 búlgaros e a migração forçada de até
    561,844 muçulmanos.
  russian-invasion-of-manchuria: >
    A invasão russa da Manchúria resultou num elevado número de baixas (pelo menos milhares),
    com as forças russas a matarem muitos manchus e a incendiarem as suas aldeias, o que fez com que milhares fugissem.
  kishinev-pogrom: >
    O pogrom de Kishinev em 1903 resultou em 47 judeus mortos, 92 gravemente feridos e 500 feridos,
    com mais de 1,500 casas e 600 lojas danificadas ou saqueadas.
  kyiv-pogrom-1905: >
    O pogrom de Kyiv de 1905 resultou no massacre de aproximadamente 100 judeus
    e em ferimentos graves em pelo menos mais 300.
  odessa-pogroms: >
    Os pogroms de Odesa, marcados por tumultos e ataques anti-semitas, causaram mais de 500 vítimas judias,
    300 feridos e destruição generalizada de propriedade.
  bialystok-pogrom: >
    O pogrom de Białystok, orquestrado pelas autoridades russas, resultou na morte de 88 pessoas,
    incluindo 82 judeus, e no saque de 169 lojas e casas.
  russian-occupation-of-tabriz: >
    A ocupação russa de Tabriz (1909-1918) resultou num número significativo de vítimas civis.
    1,200 civis e revolucionários foram executados durante a ocupação.
  central-asian-revolt-of-1916: >
    A revolta da Ásia Central de 1916, desencadeada pelo recrutamento forçado para o exército russo, levou
    à morte de 100,000 a 500,000 centro-asiáticos devido à violência, doenças e fome.
