lead: >
  A Federação Russa mantém as ambições imperiais da [União Soviética](/pt/soviet_crimes/).
  Ela continua sua conquista atroz contra
  [ossetas](#south-ossetia-war-1991-1992),
  [tchetchenos](#second-chechen-war),
  [georgianos](#russo-georgian-war)
  e [ucranianos](#russo-ukrainian-war),
  cometendo
  [massacres](#izium-mass-graves),
  [execuções](#novye-aldi-massacre),
  [tortura](#bucha-massacre),
  tendo como alvo
  [prisioneiros de guerra](#olenivka-prison-massacre)
  e [civis](#siege-of-mariupol).
entries:
  south-ossetia-war-1991-1992: >
    A Guerra da Ossétia do Sul de 1991-1992, envolvendo separatistas ossetas
    apoiados pela Rússia, resultou em cerca de 1,000 mortes e na deslocação de mais de 63,000 pessoas.
  battle-of-grozny-1994-1995: >
    A invasão russa de Grozny, de Dezembro de 1994 a Março de 1995, envolveu intensos ataques
    de artilharia e aéreos, resultando num número significativo de vítimas civis, estimado entre 5,000 e 30,000 mortes.
  samashki-massacre: >
    Em Abril de 1995, as forças russas mataram mais de 100 civis em Samashki,
    fuzilando-os e queimando-os vivos, além de destruírem a aldeia, incluindo a escola.
  second-chechen-war: >
    A Segunda Guerra da Chechénia (1999-2009) viu as forças russas utilizarem armas proibidas e atacarem
    indiscriminadamente civis, resultando em até 25,000 mortes de civis e 5,000 desaparecimentos forçados.
  1999-russian-apartment-bombings: >
    Os atentados a apartamentos na Rússia em 1999 mataram mais de 300 pessoas e feriram mais de 1,000, instigando o medo para
    justificar a iminente Segunda Guerra da Chechénia para os civis. Investigações independentes sugerem que
    segurança do Estado russo orquestrou os ataques para intensificar o conflito e aumentar a popularidade de Putin.
  staropromyslovsky-massacre: >
    Durante o massacre de Staropromyslovsky (dezembro de 1999 a janeiro de 2000), pelo menos 38 civis, na sua maioria mulheres
    e homens idosos, foram executados por soldados russos em Grozny, na Chechénia.
  battle-of-grozny-1999-2000: >
    A Batalha de Grozny (1999-2000) envolveu intensos bombardeamentos russos, levando à designação de Grozny como a cidade mais destruída do planeta.
    Entre 5,000 e 8,000 civis foram mortos e ocorreram graves violações dos direitos humanos.
  bombing-of-katyr-yurt: >
    A 4 de fevereiro de 2000, as forças russas bombardearam Katyr-Yurt e um comboio de refugiados, matando pelo menos 363 civis.
  novye-aldi-massacre: >
    A 5 de fevereiro de 2000, durante uma operação de limpeza étnica em Novye Aldi, as forças russas executaram
    até 82 civis, incluindo pilhagens, violações e incêndios.
  komsomolskoye-massacre: >
    Durante o massacre de Komsomolskoye, cerca de 72 combatentes chechenos que se renderam foram quase
    todos mortos ou desapareceram após a detenção e tortura.
  moscow-theater-hostage-crisis: >
    A crise dos reféns no teatro de Moscovo, que envolveu 912 reféns feitos por 40 terroristas chechenos,
    terminou com 132 mortes depois de as forças russas terem utilizado um agente químico não divulgado.
  beslan-school-siege: >
    O cerco à escola de Beslan, que durou 3 dias em 2004, envolveu mais de 1,100 reféns,
    incluindo 777 crianças, resultando em 334 mortes, 186 das quais de crianças.
  russo-georgian-war: >
    The 2008 Russo-Georgian War, initiated by Russia, resulted in the displacement of 192,000 people
    and widespread civilian casualties.
  russo-ukrainian-war: >
    A invasão russa da Ucrânia começou em fevereiro de 2014 e continua em curso.
    Estima-se que o número de vítimas varie entre 1,274,000 e 2,000,000, das quais
    pelo menos 20,000 são civis mortos e 50,000 ficaram feridos.
  malaysia-airlines-flight-17: >
    O voo MH17 da Malaysia Airlines foi abatido por um míssil Buk disparado de um lançador associado
    a separatistas apoiados pela Rússia no leste da Ucrânia, matando todos os 298 passageiros e tripulantes.
  battle-of-debaltseve: >
    A Batalha de Debaltseve, parte da guerra no Donbas, resultou em mais de 267 mortes de ucranianos
    e grave sofrimento humanitário, tendo sido encontrados quase 500 corpos de civis após a batalha.
  siege-of-mariupol: >
    O cerco russo a Mariupol durou quase 3 meses, resultando na ocupação da cidade e na morte de pelo menos 1,348 civis,
    sendo que o número real de vítimas está estimado em milhares. O cerco provocou ainda a destruição de 90% dos edifícios
    residenciais da cidade, enquanto as forças russas bloquearam a ajuda humanitária, cometendo inúmeros crimes de guerra.
  3-march-2022-chernihiv-bombing: >
    A 3 de março de 2022, aviões russos bombardearam uma zona residencial em Chernihiv,
    matando 47 pessoas e ferindo 18, enquanto os civis realizavam as suas atividades diárias.
  irpin-refugee-column-shelling: >
    A 6 de março de 2022, as forças russas bombardearam repetidamente um cruzamento em Irpin que estava a ser utilizado
    por civis que fugiam em direção a Kyiv, matando 8 pessoas.
  9-march-2022-mariupol-hospital-3-attack: >
    A 9 de março de 2022, as forças russas bombardearam a Maternidade nº 3 em Mariupol,
    matando pelo menos 4 pessoas e ferindo pelo menos 16.
  bucha-massacre: >
    O massacre de Bucha envolveu o assassinato em massa de civis ucranianos pelas forças russas, tendo sido recuperados 458 corpos,
    incluindo 9 crianças. A ONU documentou pelo menos 73 assassinatos ilegais, e a Human Rights Watch confirmou crimes
    de guerra cometidos pelas tropas russas, incluindo execuções e tortura.
  16-march-2022-chernihiv-breadline-attack: >
    A 16 de março de 2022, as forças russas atacaram civis que faziam fila para comprar pão em Chernihiv, matando 18 pessoas e ferindo 26.
  mariupol-theatre-airstrike: >
    As Forças Armadas Russas bombardearam o teatro de Mariupol a 16 de março de 2022,
    utilizado como abrigo antiaéreo civil, causando até 600 mortos.
  kramatorsk-railway-station-attack: >
    A 8 de abril de 2022, um ataque com mísseis russos atingiu a estação ferroviária de Kramatorsk,
    matando 63 civis, incluindo 9 crianças, e ferindo 150.
  kremenchuk-shopping-mall-attack: >
    A 27 de junho de 2022, mísseis russos atingiram o centro comercial de Kremenchuk, matando pelo menos 20 pessoas e ferindo 59.
  serhiivka-missile-strike: >
    O ataque com mísseis russos em Serhiivka, a 1 de julho de 2022, matou pelo menos 21 civis
    e feriu 38, entre eles 6 crianças.
  july-2022-chasiv-yar-missile-strike: >
    A 9 de julho de 2022, as forças russas dispararam mísseis Uragan contra edifícios residenciais em Chasiv Yar,
    matando pelo menos 48 pessoas.
  vinnytsia-strikes-2022-present: >
    A 14 de julho de 2022, as forças navais russas lançaram mísseis Kalibr contra a região central de Vinnytsia,
    atingindo um centro médico e a Casa dos Oficiais, matando mais de 28 pessoas e ferindo mais de 202 civis.
  olenivka-prison-massacre: >
    As forças russas bombardearam uma prisão ucraniana em Olenivka, matando 53 prisioneiros de guerra ucranianos
    e ferindo entre 75 e 130. As investigações independentes apontam para a responsabilidade da Rússia
    e para a recusa russa em cooperar com as investigações da ONU.
  izium-mass-graves: >
    Após as forças ucranianas terem recapturado Izium durante a contra-ofensiva de Kharkiv,
    foram descobertos 447 corpos em valas comuns, incluindo 414 civis (215 mulheres, 194 homens e 5 crianças) e 22 militares.
  kupiansk-civilian-convoy-shelling: >
    A 25 de setembro de 2022, soldados russos atacaram um comboio de evacuação civil perto de Kupiansk,
    matando 26 pessoas e permitindo que 22 escapassem enquanto fugiam da cidade.
  zaporizhzhia-civilian-convoy-attack: >
    A 30 de setembro de 2022, as forças russas lançaram mísseis contra um comboio civil perto de Zaporizhzhia,
    enquanto as pessoas se reuniam para viajar para o território ocupado pela Rússia, matando 32 pessoas e ferindo aproximadamente 88.
  2022-zaporizhzhia-residential-building-airstrike: >
    A 9 de outubro de 2022, as forças russas lançaram mísseis contra uma zona residencial em Zaporizhzhia,
    destruindo um prédio de apartamentos, matando 13 pessoas e ferindo 89.
  2023-dnipro-residential-building-airstrike: >
    A 14 de janeiro de 2023, as forças russas atingiram um prédio de apartamentos de 9 andares em Dnipro com um míssil Kh-22,
    matando 46 e ferindo 80 civis.
  april-2023-sloviansk-airstrike: >
    A 14 de abril de 2023, mísseis russos atingiram edifícios residenciais em Sloviansk durante a Sexta-feira Santa Ortodoxa,
    matando 15 civis, incluindo uma criança, e ferindo 24.
  2023-uman-missile-strike: >
    A 28 de abril de 2023, as forças russas atingiram um edifício residencial em Uman
    com um míssil de cruzeiro Kh-101, matando 23 civis e ferindo 9.
  destruction-of-the-kakhovka-dam: >
    As forças russas romperam a barragem de Kakhovka a 6 de junho de 2023, causando inundações catastróficas a jusante.
    Pelo menos 59 pessoas foram oficialmente confirmadas como mortas, com o número potencial de vítimas a atingir as centenas.
  2023-kramatorsk-restaurant-missile-strike: >
    A 27 de junho de 2023, as forças russas lançaram 2 mísseis contra Kramatorsk,
    atingindo um restaurante civil lotado e matando 13 pessoas, incluindo 4 crianças, enquanto 65 ficaram feridas.
  lyman-cluster-bombing: >
    A 8 de julho de 2023, as forças russas utilizaram munições de fragmentação Smerch contra
    uma área residencial no centro de Lyman, matando 9 e ferindo 13 civis.
  2023-pokrovsk-missile-strike: >
    A 7 de agosto de 2023, as forças russas atacaram Pokrovsk por duas vezes com mísseis Iskander,
    matando 10 pessoas e ferindo 88, incluindo equipas de emergência que chegaram ao local do primeiro impacto.
  august-2023-chernihiv-missile-strike: >
    A 19 de agosto de 2023, um míssil russo Iskander-M atingiu o centro de Chernihiv, perto do Teatro de Taras Shevchenko,
    matando 7 pessoas e ferindo mais de 144, durante uma exposição com a participação de civis.
  hroza-missile-attack: >
    A 5 de outubro de 2023, um míssil russo Iskander atingiu um café em Hroza durante
    uma homenagem a um soldado ucraniano, matando 59 civis e ferindo 7.
  2024-pokrovsk-missile-strike: >
    A 6 de janeiro de 2024, as forças russas lançaram um ataque com mísseis contra uma área residencial em Pokrovsk,
    matando 12 pessoas, incluindo 6 crianças, e ferindo 10.
  15-march-2024-odesa-missile-strikes: >
    A 15 de março de 2024, as forças russas atacaram Odesa, matando 21 pessoas e ferindo 74.
  25-may-2024-kharkiv-missile-strikes: >
    A 25 de maio de 2024, as forças russas atacaram Kharkiv, incluindo o hipermercado Epicentr K,
    matando 19 pessoas e ferindo mais de 65.
  8-july-2024-russian-strikes-on-ukraine: >
    A 8 de julho de 2024, ataques russos em toda a Ucrânia mataram 47 pessoas e feriram cerca de 170,
    tendo um míssil atingido o hospital infantil Okhmatdyt, em Kyiv.
  september-2024-poltava-strike: >
    A 3 de setembro de 2024, mísseis russos atingiram um instituto militar e um hospital em Poltava,
    na Ucrânia, matando pelo menos 59 pessoas e ferindo 328.
  2025-sumy-airstrike: >
    A 13 de abril de 2025, mísseis balísticos russos atingiram o centro de Sumy durante os serviços religiosos,
    matando 35 pessoas, incluindo 2 crianças, e ferindo 129, 15 das quais crianças.
  2025-yarova-attack: >
    A 9 de setembro de 2025, as forças russas atacaram Yarova com uma bomba planadora enquanto
    os reformados se reuniam para receber as suas pensões, matando 25 pessoas e ferindo 19.
