lead: >
  A União Soviética deu continuidade à conquista e ao terror do [Império Russo](/pt/empire_crimes/) em escala industrial.
  [Massacres em massa](#pogroms-during-the-russian-civil-war),
  [fomes](#holodomor)
  e [deportações](#operation-priboi)
  foram realizados contra
  [Ucranianos](#executed-renaissance),
  [Tártaros da Crimeia](#deportation-of-the-crimean-tatars),
  [Letões](#latvian-operation-of-the-nkvd),
  [Lituanos](#soviet-deportations-from-lithuania),
  [Estonianos](#estonian-operation-of-the-nkvd),
  [Finlandeses](#finnish-operation-of-the-nkvd),
  [Poloneses](#treaty-of-riga),
  [Bielorrussos](#1937-mass-execution-of-belarusians),
  [Georgianos](#soviet-invasion-of-georgia),
  [Cazaques](#kazakh-famine-of-1930-1933),
  [Judeus](#night-of-the-murdered-poets),
  [Armênios](#black-january),
  [Gregos](#deportation-of-the-soviet-greeks),
  [Alemães](#deportation-of-soviet-germans-1941-1942),
  [Húngaros](#hungarian-revolution-of-1956),
  [Mongóis](#stalinist-repressions-in-mongolia),
  [Calmucos](#deportation-of-the-kalmyks),
  [Chechenos e inguches](#operation-lentil-caucasus),
  [Afegãos](#soviet-afghan-war),
  [Bálcaros](#deportation-of-the-balkars),
  [Turcos mesquécios](#deportation-of-the-meskhetian-turks),
  [Coreanos](#deportation-of-koreans-in-the-soviet-union),
  e [Japoneses](#gegenmiao-massacre).

entries:
  opposition-to-the-russian-orthodox-church-during-the-russian-civil-war: >
    Durante a Guerra Civil Russa, os bolcheviques mataram pelo menos 1 metropolita, 18 bispos, 102
    padres, 154 diáconos e 94 monges e freiras entre junho de 1918 e janeiro de 1919. Também
    atacaram e profanaram numerosos mosteiros e igrejas.
  makhnovshchina: >
    O Makhnovshchina, um movimento anarquista-comunista, enfrentou uma severa repressão por parte dos
    bolcheviques, resultando na morte de 200,000 camponeses ucranianos.
  pogroms-during-the-russian-civil-war: >
    De 1918 a 1920, ocorreram mais de 1,300 pogroms na Ucrânia, resultando entre 35,000 e
    250,000 mortes. De 50,000 a 300,000 crianças ficaram órfãs.
  basmachi-movement: >
    O movimento Basmachi, uma revolta contra o domínio russo e soviético na Ásia Central,
    levou o Exército Vermelho a levar a cabo um massacre de até 25,000 pessoas em Kokand, em 1918.
  red-terror: >
    O Terror Vermelho, iniciado pelos bolcheviques em setembro de 1918, tinha como objetivo suprimir
    a dissidência política e a oposição durante a Guerra Civil Russa. Entre 1918 e 1922,
    a campanha levou à execução de pelo menos 50,000 pessoas, marcando o início do sistema Gulag
    e causando milhares de outras mortes devido às duras condições nos campos de trabalho forçado.
  executed-renaissance: >
    O termo "Renascimento Executado" refere-se à eliminação de artistas e intelectuais ucranianos durante
    a década de 1920 e o início da década de 1930, com 45 intelectuais condenados e mais de 30,000 presos, deportados,
    ou executados após a ascensão de Estaline e o Grande Terror de 1937-38.
  tambov-rebellion: >
    A Revolta de Tambov, de 1920 a 1922, foi uma importante revolta camponesa contra as requisições forçadas de cereais
    pelo governo bolchevique, levando a uma brutal repressão que matou cerca de
    15,000 pessoas e deteve 100,000.
  russian-famine-of-1921-1922: >
    A fome russa de 1921-1922, que afetou as regiões do Volga e dos Urais, matou cerca de 5,000,000 de pessoas devido à seca, à guerra,
    às políticas económicas e aos surtos de doenças.
    A requisição de mantimentos aos camponeses por parte do governo bolchevique, sem a devida compensação, agravou a crise.
  ussr-anti-religious-campaign-1921-1928: >
    A campanha antirreligiosa da URSS (1921-1928) tinha como objetivo eliminar a religião através da propaganda e da perseguição.
    Aproximadamente 8,100 clérigos, monges e freiras foram assassinados, as igrejas e mosteiros foram sistematicamente encerrados
    e a Igreja Ortodoxa perdeu a sua capacidade de formar novos clérigos em 1928.
  soviet-invasion-of-georgia: >
    A invasão soviética da Geórgia, em Fevereiro de 1921, liderada por Estaline e Ordzhonikidze, culminou com a
    execução de 12,578 georgianos e no exílio de mais de 20,000 para a Sibéria em 1924.
  treaty-of-riga: >
    O Tratado de Riga pôs fim à Guerra Polaco-Soviética, incorporando 4,000,000 de ucranianos e mais de 1,000,000
    de bielorrussos na Polónia, o que levou a tensões étnicas. Os polacos étnicos dentro das fronteiras soviéticas
    enfrentaram uma severa repressão, tendo pelo menos 111,000 sido executados em 1937/38.
  ussr-anti-religious-campaign-1928-1941: >
    Entre 1928 e 1941, a União Soviética impôs uma campanha anti-religiosa que levou à
    encerramento de quase todas as igrejas e à prisão e morte de até 200,000 membros do clero,
    restringindo severamente a prática e a expressão religiosa.
  shakhty-trial: >
    O julgamento de Shakhty, com 11 dos 53 engenheiros acusados ​​condenados à morte, a substituir profissionais qualificados
    por jovens alinhados politicamente.
  genocide-of-the-ingrian-finns: >
    As ações da União Soviética contra os finlandeses da Ingria, incluindo deportações, prisões e
    assassinatos, resultaram na redução da população de 140,000-160,000 para aproximadamente 19,000 até
    os dias de hoje. Mais de 100,000 finlandeses russos foram deportados sem julgamento, e dezenas de milhares morreram em
    campos de trabalho forçado.
  dekulakization: >
    A desculaquização, uma campanha contra os chamados kulaks na União Soviética, levou a prisões em massa,
    execuções e deportações, com as estimativas a sugerirem entre 530,000 e 600,000 mortes de
    1930 a 1933.
  kazakh-famine-of-1930-1933: >
    A fome no Cazaquistão de 1930-1933, resultante das políticas de coletivização soviéticas, levou à morte de
    um número estimado entre 1,300,000 e 2,300,000 pessoas, com 38 a 42% de todos os cazaques a perecer.
  holodomor: >
    O Holodomor, uma fome provocada pelo homem na Ucrânia entre 1932 e 1933, resultou em entre
    3,500,000 e 5,000,000 mortes devido às políticas de Estaline de elevadas quotas de cereais e baixas rações alimentares.
  great-purge: >
    O Grande Expurgo, realizado entre 1936 e 1938, envolveu a execução ou prisão de centenas
    de milhares de cidadãos soviéticos suspeitos de dissidência política. As estimativas sugerem que entre
    700,000 e 1,200,000 pessoas foram mortas.
  vinnytsia-massacre: >
    Mais de 9,400 pessoas foram executadas secretamente em Vinnytsia pela NKVD soviética entre 1937 e 1938.
  nkvd-order-no-00439: >
    A Ordem nº 00439 da NKVD, promulgada em 1937, levou à prisão de cerca de 800 cidadãos alemães e ex-cidadãos,
    e condenou aproximadamente 55,005 cidadãos soviéticos de ascendência alemã, dos quais 41,898 receberam penas de morte.
  nkvd-order-no-00447: >
    A Ordem nº 00447 da NKVD levou à execução de 386,798 cidadãos soviéticos até 1938.
  nkvd-order-no-00485: >
    A Ordem nº 00485 da NKVD, emitida em 1937, foi uma campanha de limpeza étnica contra os polacos, visando
    139,815 indivíduos, dos quais 111,071 foram condenados à morte sem julgamento. Esta operação fez parte
    operações nacionais mais amplas que afetaram diversos grupos étnicos, incluindo alemães, letões,
    finlandeses, estónios, romenos, gregos e outros.
  polish-operation-of-the-nkvd: >
    A Operação Polaca da NKVD resultou na condenação de 139,835 pessoas e na execução de
    111,091 polacos, visando polacos e outros percecionados como desleais, levando à deportação de famílias
    e ao extermínio da minoria polaca.
  deportation-of-koreans-in-the-soviet-union: >
    Em 1937, 172,000 coreanos soviéticos foram transferidos à força ao longo de 6,400 km até à Ásia Central, com até
    50,000 morrendo devido às duras condições.
  stalinist-repressions-in-mongolia: >
    As repressões estalinistas na Mongólia, entre 1937 e 1939, levaram à execução de entre 20,000
    e 35,000 pessoas.
  1937-mass-execution-of-belarusians: >
    Em outubro de 1937, mais de 100 intelectuais bielorrussos foram executados pelas autoridades soviéticas. 103
    Bielorrussos mortos, com mais de 100,000 vítimas de repressões mais vastas entre 1937 e 1938.
  latvian-operation-of-the-nkvd: >
    Durante a Grande Purga de Estaline, a NKVD prendeu e executou milhares de letões, com 16,573
    dos 22,369 letões condenados a serem fuzilados, e as instituições culturais foram desmanteladas.
  estonian-operation-of-the-nkvd: >
    Durante a Grande Purga (1937-1938), a NKVD realizou a Operação Estónia, condenando 5,680
    indivíduos a várias punições, tendo 4,672 recebido penas de morte.
  finnish-operation-of-the-nkvd: >
    A Operação Finlandesa da NKVD prendeu, deportou e executou finlandeses soviéticos durante o Grande
    Expurgo de 1937-1938. Os finlandeses representavam 3% da população da ASSR da Carélia, mas mais de 40% das vítimas do
    Grande Terror; dos quase 6,200 cidadãos finlandeses condenados, mais de 4,700 foram executados.
  soviet-invasion-of-poland: >
    A invasão soviética da Polónia a 17 de setembro de 1939 levou à captura
    de 320,000 polacos e iniciou uma campanha de perseguição em massa. Entre 1939 e 1941,
    a NKVD soviética deportou centenas de milhares de pessoas do leste da Polónia.
  katyn-massacre: >
    Em 1940, a polícia secreta soviética executou quase 22,000 oficiais militares
    e intelectuais polacos em Katyn.
  soviet-deportations-from-bessarabia-and-northern-bukovina: >
    Entre 1940 e 1951, a União Soviética deportou 46,000 pessoas da República Socialista Soviética da Moldávia.
  soviet-deportations-from-latvia: >
    O governo soviético deportou aproximadamente 60,000 letões para regiões remotas e inóspitas da União Soviética.
  soviet-deportations-from-lithuania: >
    Entre 1941 e 1952, a União Soviética deportou à força pelo menos 130,000 lituanos,
    70% dos quais eram mulheres e crianças, para campos de trabalho forçado.
    Destes deportados, aproximadamente 28,000 morreram no exílio devido às duras condições de vida.
  nkvd-prisoner-massacres-in-lviv: >
    Entre 3,500 e 7,000 prisioneiros em Lviv, incluindo ucranianos, polacos e judeus, foram brutalmente
    executados por oficiais soviéticos da NKVD em junho de 1941, quando os soviéticos recuaram perante o avanço das forças alemãs.
  nkvd-prisoner-massacre-in-lutsk: >
    A 23 de junho de 1941, enquanto as forças alemãs avançavam durante a Segunda Guerra Mundial,
    a NKVD soviética executou cerca de 2,000 prisioneiros políticos em Lutsk.
  anglo-soviet-invasion-of-iran: >
    A invasão anglo-soviética do Irão em 1941 resultou em mais de 200 vítimas civis em bombardeamentos.
  deportation-of-soviet-germans-1941-1942: >
    Durante a Segunda Guerra Mundial, o governo soviético deportou pelo menos 846,340 alemães da região do Volga e de outras partes
    da União Soviética ocidental para a Sibéria e o Cazaquistão devido aos receios de colaboração com a Alemanha Nazi, causando 228,800 mortos.
  deportation-of-the-soviet-greeks: >
    O regime de Estaline expulsou à força cerca de 70,000 a 80,000 gregos da costa do Mar Negro
    entre 1942 e 1949, com pelo menos 15,000 mortes como resultado.
  deportation-of-the-karachays: >
    O governo soviético deportou quase 70,000 carachais em novembro de 1943, resultando em pelo
    13,000 mortes. Apesar de 20,000 carachais terem servido no Exército Vermelho, o governo acusou-os falsamente
    de colaborarem com as forças alemãs, o que levou à sua deslocação forçada para campos de trabalho
    na Ásia Central.
  deportation-of-the-kalmyks: >
    Mais de 93,000 calmucos foram transferidos à força para a Sibéria em dezembro de 1943, sob falsas acusações
    de colaboração com o Eixo, resultando em mais de 16,000 mortes, apesar de 23,000
    calmucos a servir no Exército Vermelho.
  operation-lentil-caucasus: >
    Em 1944, 496,000 tchetchenos e ingushes foram deportados à força pelo governo soviético, com
    123,000 a 200,000 mortos durante o transporte devido às duras condições.
  deportation-of-the-balkars: >
    Em 1944, 37,713 balcários foram deportados à força da sua terra natal num único dia, com 7,600 a 11,000 mortes,
    ou 20 a 25% do seu grupo étnico, como resultado das ações do governo soviético.
  deportation-of-the-crimean-tatars: >
    Em 1944, pelo menos 191,044 tártaros da Crimeia foram deportados pelas autoridades soviéticas,
    resultando na morte de quase 8,000 durante o trânsito e de mais dezenas de milhares devido às duras condições de vida.
  deportation-of-the-meskhetian-turks: >
    Entre 92,307 e 94,955 turcos mesquétios foram deportados à força para a Ásia Central em 1944,
    resultando em até 50,000 mortes. A política fazia parte de um plano soviético mais vasto para remover as minorias muçulmanas
    do Cáucaso, deixando os turcos mesquétios apátridas e dispersos por 7
    países.
  soviet-deportations-from-estonia: >
    Entre 1945 e 1953, mais de 35,000 pessoas, principalmente mulheres e crianças, foram deportadas à força
    da Estónia para zonas remotas da União Soviética, constituindo um crime contra a humanidade,
    conforme declarado pelo Tribunal Europeu dos Direitos Humanos. Mais de 70% dos deportados em 1949 eram mulheres
    e crianças com menos de 16 anos.
  soviet-annexation-of-transcarpathia: >
    A União Soviética anexou a Transcarpátia, provocando a emigração de mais de 120,000 pessoas e
    deslocando cerca de 450,000 habitantes da Checoslováquia.
  augustow-roundup: >
    A rusga de Augustów, levada a cabo pelas forças soviéticas em 1945, levou à prisão de mais
    de 2,000 anticomunistas polacos, tendo sido executadas 600 pessoas.
  soviet-invasion-of-south-sakhalin: >
    A invasão soviética do sul de Sacalina resultou em aproximadamente 5.000 a 6.000 baixas militares e civis japonesas
    e na captura de cerca de 18.202 soldados, que foram enviados para campos de trabalho forçado na Sibéria.
    Além disso, pelo menos 100.000 civis japoneses fugiram para evitar o controlo soviético.
  gegenmiao-massacre: >
    Durante a invasão soviética da Manchúria, em agosto de 1945, o Exército Vermelho massacrou mais de 1,000
    mulheres e crianças japonesas em Gegenmiao, fuzilando-as, atropelando-as com tanques e
    atacando-as com baionetas depois de estas terem hasteado uma bandeira branca.
  operation-vistula: >
    A Operação Vístula envolveu o realojamento forçado de quase 150,000 ucranianos e outros do sudeste
    da Polónia para norte e oeste em 1947, com a aprovação soviética, para eliminar o apoio ao Exército Insurgente Ucraniano.
    Mais de 126,000 ucranianos foram detidos pela NKVD entre 1945 e 1947, e quase 32,000 foram mortos.
  operation-priboi: >
    A Operação Priboi envolveu a deportação de mais de 90,000 pessoas dos Estados Bálticos para a Sibéria em 1949,
    principalmente mulheres e crianças com menos de 16 anos, para facilitar a coletivização e eliminar a resistência.
    Em 1950, mais de 4,000 deportados, incluindo 2,080 crianças, tinham morrido.
  operation-north: >
    A Operação Norte, autorizada pelo Ministério da Segurança do Estado da URSS, levou à deportação forçada
    de 9,973 Testemunhas de Jeová e das suas famílias para a Sibéria em 1951,
    onde foram classificadas como "colonos especiais" e enfrentaram uma severa perseguição.
  operation-osen: >
    A Operação Osen, em 1951, envolveu a deportação de mais de 20,000 pessoas da Lituânia
    para regiões remotas da União Soviética.
  night-of-the-murdered-poets: >
    A 12 de agosto de 1952, 13 judeus soviéticos, incluindo escritores iídiche do Comité Judaico Antifascista,
    foram executados em Moscovo sob falsas acusações de espionagem e traição.
  east-german-uprising-of-1953: >
    A revolta da Alemanha de Leste de 1953 envolveu mais de 1,000,000 de pessoas em 700 localidades e levou à
    morte de mais de 125 civis depois de as forças soviéticas terem reprimido os protestos.
  1956-georgian-demonstrations: >
    O Exército Soviético matou pelo menos 21 pessoas e feriu 55 em resposta às manifestações georgianas de 1956.
  hungarian-revolution-of-1956: >
    A Revolução Húngara de 1956, que durou 15 dias, foi esmagada pelas forças soviéticas a 7 de novembro de
    1956, resultando em 2,500 mortes de húngaros e 700 mortes de soviéticos. A revolta levou à
    prisão de 22,000 pessoas e à execução de 229 indivíduos, sendo que quase um quarto de
    milhão de húngaros em fuga do país.
  ussr-anti-religious-campaign-1958-1964: >
    Durante a campanha anti-religiosa de Khrushchev (1958-1964), mais de 50,000 membros do clero foram executados, e
    o número de igrejas ortodoxas em funcionamento foi reduzido de mais de 20,000 para 6,850 em 1972.
  novocherkassk-massacre: >
    O massacre de Novocherkassk, onde as tropas soviéticas abriram fogo sobre manifestantes desarmados,
    resultou em 24 mortes e 87 feridos graves.
  soviet-afghan-war: >
    A Guerra Soviético-Afegã, de 1979 a 1989, resultou na morte de entre 1,000,000 e 3,000,000 de afegãos e na deslocação de
    5,500,000 de refugiados.
    As forças soviéticas cometeram inúmeras atrocidades, incluindo ataques a civis e destruição de infraestruturas.
  rauzdi-massacre: >
    A 30 de junho de 1983, o Exército Soviético matou 24 pessoas em Rauzdi, no Afeganistão, incluindo 23
    civis, em retaliação por um confronto com um membro da resistência anticomunista de 18 anos.
  kulchabat-bala-karz-and-mushkizi-massacre: >
    O Exército Soviético matou até 360 civis, incluindo 20 raparigas e mais de uma dezena de idosos,
    em 3 aldeias afegãs, como medida de retaliação pela destruição de veículos militares soviéticos.
    Testemunhas oculares relataram assassinatos brutais, incluindo granadas lançadas em salas cheias de mulheres e crianças.
  kunduz-massacre: >
    Durante o massacre de Kunduz, o Exército soviético matou cerca de 250 civis em represália pela resistência dos mujahidin.
    As atrocidades incluíram pilhagens, destruição, violação e a execução sistemática de aldeões.
  laghman-massacre: >
    O massacre de Laghman envolveu as forças soviéticas, que mataram entre 500 e 1,000 civis com recurso a bombas de napalm.
  black-january: >
    Em Janeiro de 1990, as tropas soviéticas entraram em Baku para reprimir os sentimentos anti-soviéticos
    e anti-arménios, resultando em 147 mortes de civis e 800 feridos.
