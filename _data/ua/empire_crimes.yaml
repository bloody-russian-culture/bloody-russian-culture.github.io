lead: >
  Російська імперія постала шляхом завоювань і трималася на терорі. Вона відібрала
  [Сибір](#russian-conquest-of-siberia) в корінних народів, очистила [Північний Кавказ](#caucasian-war)
  від [черкесів](#circassian-genocide), страчувала й висилала [поляків](#january-uprising),
  а також організовувала погроми проти [українців, євреїв, і римо-католиків](#koliivshchyna).
entries:
  russian-conquest-of-siberia: >
    Російське завоювання Сибіру супроводжувалося значним насильством і примусом щодо корінного населення:
    понад 80% тунгусів та якутів загинули від віспи, занесеної російськими першопрохідцями
    в період між 1650-ми та 1690-ми роками.
  koliivshchyna: >
    Повстання «Коліївщина» на Правобережній Україні 1768 року, підживлюване російською підтримкою,
    призвело до масової загибелі від 100,000 до 200,000 осіб,
    серед яких були поляки, євреї та римо-католики.
  caucasian-war: >
    Кавказька війна, що тривала протягом XIX століття, супроводжувалася завоюванням Північного Кавказу
    Російською імперією та призвела до загибелі понад 700,000 цивільних осіб.
  january-uprising: >
    Січневе повстання проти російського імперського панування в Польщі призвело до жорстоких репресій,
    зокрема страти 396 осіб і заслання до Сибіру 18,672 осіб. Понад 60,000 людей
    було ув’язнено та вислано.
  circassian-genocide: >
    Російська імперія здійснювала систематичні масові вбивства, етнічні чистки та примусово виселила 
    від 95% до 97% черкеського народу, що призвело до загибелі до 1,500,000 людей.
  russo-turkish-war-1877-1878: >
    Російсько-турецька війна (1877-1878 рр.) супроводжувалася
    значними втратами серед цивільного населення, зокрема різаниною 14,000 болгар
    і примусовим переселенням до 561,844 мусульман.
  russian-invasion-of-manchuria: >
    Російське вторгнення до Маньчжурії призвело до значних людських втрат (щонайменше кілька тисяч осіб):
    російські війська вбили багато маньчжурів і спалили їхні села, змусивши тисячі людей тікати.
  kishinev-pogrom: >
    Унаслідок Кишинівського погрому 1903 року загинуло 47 євреїв,
    92 особи було тяжко поранено і 500 травмовано. Також було пошкоджено
    і пограбовано понад 1500 будинків і 600 крамниць.
  kyiv-pogrom-1905: >
    Київський погром 1905 року призвів до загибелі близько 100 євреїв
    і тяжких поранень щонайменше ще 300 осіб.
  odessa-pogroms: >
    Одеські погроми, що супроводжувалися антиєврейськими заворушеннями та нападами,
    призвели до загибелі понад 500 євреїв,
    поранення 300 осіб та масштабного руйнування майна.
  bialystok-pogrom: >
    Погром у Білостоці, організований російською владою, призвів до загибелі 88 осіб,
    зокрема 82 євреїв, а також до пограбування 169 крамниць і будинків.
  russian-occupation-of-tabriz: >
    Російська окупація Тебриза (1909-1918 рр.) призвела до значних втрат серед цивільного населення.
    Під час окупації було страчено 1,200 мирних жителів і революціонерів.
  central-asian-revolt-of-1916: >
    Повстання 1916 року в Центральній Азії, спричинене примусовою мобілізацією до російської армії,
    призвело до загибелі від 100,000 до 500,000 жителів регіону внаслідок насильства, хвороб і голоду.
