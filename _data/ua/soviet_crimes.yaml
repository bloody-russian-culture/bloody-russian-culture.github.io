lead: >
  Радянський Союз продовжив завоювання й терор [Російської імперії](/ua/empire_crimes/) у промислових масштабах.
  [Масові вбивства](#pogroms-during-the-russian-civil-war),
  [голодомори](#holodomor),
  та [депортації](#operation-priboi)
  здійснювалися проти
  [українців](#executed-renaissance),
  [кримських татар](#deportation-of-the-crimean-tatars),
  [латишів](#latvian-operation-of-the-nkvd),
  [литовців](#soviet-deportations-from-lithuania),
  [естонців](#estonian-operation-of-the-nkvd),
  [фінів](#finnish-operation-of-the-nkvd),
  [поляків](#treaty-of-riga),
  [білорусів](#1937-mass-execution-of-belarusians),
  [грузинів](#soviet-invasion-of-georgia),
  [казахів](#kazakh-famine-of-1930-1933),
  [євреїв](#night-of-the-murdered-poets),
  [вірмен](#black-january),
  [греків](#deportation-of-the-soviet-greeks),
  [німців](#deportation-of-soviet-germans-1941-1942),
  [угорців](#hungarian-revolution-of-1956),
  [монголів](#stalinist-repressions-in-mongolia),
  [калмиків](#deportation-of-the-kalmyks),
  [чеченців та інгушів](#operation-lentil-caucasus),
  [афганців](#soviet-afghan-war),
  [балкарців](#deportation-of-the-balkars),
  [месхетинських турків](#deportation-of-the-meskhetian-turks),
  [корейців](#deportation-of-koreans-in-the-soviet-union),
  і [японців](#gegenmiao-massacre).

entries:
  opposition-to-the-russian-orthodox-church-during-the-russian-civil-war: >
    Під час громадянської війни в Росії, у період із червня 1918 року до січня 1919 року, більшовики вбили щонайменше одного митрополита,
    18 єпископів, 102 священників, 154 диякони та 94 ченців і черниць. Вони також нападали на численні монастирі й церкви та оскверняли їх.
  makhnovshchina: >
    Анархо-комуністичний рух «Махновщина» зазнала жорстоких репресій з боку більшовиків,
    що призвело до загибелі 200,000 українських селян.
  pogroms-during-the-russian-civil-war: >
    У період з 1918 по 1920 рік в Україні відбулося понад 1,300 погромів,
    унаслідок яких загинуло від 35,000 до 250,000 осіб, а від 50,000 до 300,000 дітей залишилися сиротами.
  basmachi-movement: >
    Повстання Басмачів проти російського та радянського панування в Середній Азії призвело до того,
    що у 1918 році Червона армія влаштувала різанину в Коканді, внаслідок якої загинуло до 25,000 осіб.
  red-terror: >
    Червоний терор, розпочатий більшовиками у вересні 1918 року, мав на меті придушення політичного інакомислення та опозиції
    під час громадянської війни в Росії. У період з 1918 по 1922 рік ця кампанія призвела до страти щонайменше 50,000 осіб,
    поклала початок системі ГУЛАГу та спричинила загибель іще тисяч людей внаслідок жахливих умов у виправно-трудових таборах.
  executed-renaissance: >
    Термін «Розстріляне відродження» позначає знищення українських митців та інтелектуалів у 1920-х - на початку 1930-х років:
    45 представників інтелігенції було засуджено, а понад 30,000 - заарештовано, депортовано або страчено після приходу Сталіна
    до влади та внаслідок Великого терору 1937-1938 років.
  tambov-rebellion: >
    Тамбовське повстання (1920-1922 рр.) було масштабним селянським виступом проти примусових хлібозаготівель,
    здійснюваних більшовицьким урядом. Воно було жорстоко придушене, внаслідок чого загинуло близько 15,000 осіб,
    а 100,000 було заарештовано.
  russian-famine-of-1921-1922: >
    Голод у Росії 1921-1922 років, що охопив Надволжя та Урал, забрав життя близько 5,000,000 людей
    внаслідок посухи, війни, економічної політики та спалахів хвороб. Ситуацію погіршило вилучення
    більшовицьким урядом продовольства в селян без належної компенсації.
  ussr-anti-religious-campaign-1921-1928: >
    Антирелігійна кампанія в СРСР (1921-1928 рр.) мала на меті викорінення релігії шляхом пропаганди та переслідувань.
    Було вбито близько 8,100 представників духовенства, ченців і черниць, церкви та монастирі систематично закривалися,
    а до 1928 року Православна церква втратила можливість готувати нове духовенство.
  soviet-invasion-of-georgia: >
    Радянське вторгнення до Грузії в лютому 1921 року під керівництвом Сталіна та Орджонікідзе
    призвело до страти 12,578 грузинів і вислання понад 20,000 осіб до Сибіру в 1924 році.
  treaty-of-riga: >
    Ризький мирний договір поклав край польсько-радянській війні та включив до складу Польщі
    4,000,000 українців і понад 1,000,000 білорусів, що призвело до міжетнічної напруги.
    Етнічні поляки в межах радянських кордонів зазнали жорстоких репресій:
    у 1937-1938 роках було страчено щонайменше 111,000 осіб.
  ussr-anti-religious-campaign-1928-1941: >
    У період між 1928 та 1941 роками Радянський Союз проводив антирелігійну кампанію,
    що призвела до закриття майже всіх церков та ув’язнення і загибелі до 200,000 представників духовенства,
    суттєво обмеживши релігійну практику та можливість відкрито сповідувати віру.
  shakhty-trial: >
    Шахтинський процес, унаслідок якого 11 із 53 обвинувачених інженерів було засуджено до смертної кари,
    а кваліфікованих фахівців замінено політично лояльною молоддю.
  genocide-of-the-ingrian-finns: >
    The Soviet Union's actions against the Ingrian Finns, including deportations, imprisonments, and killings,
    resulted in the population declining from 140,000-160,000 to approximately 19,000 by today.
    Over 100,000 Russian Finns were deported without trial, and tens of thousands died in labor camps.
  dekulakization: >
    Розкуркулення - кампанія проти так званих куркулів у Радянському Союзі - призвело до масових арештів,
    страт і депортацій; за оцінками, у період з 1930 по 1933 рік загинуло від 530,000 до 600,000 осіб.
  kazakh-famine-of-1930-1933: >
    Казахський голод 1930-1933 років, спричинений політикою радянської колективізації,
    призвів до загибелі, за різними оцінками, від 1,300,000 до 2,300,000 людей; при цьому загинуло 38-42% усіх казахів.
  holodomor: >
    Голодомор - штучно створений голод в Україні у 1932-1933 роках - призвів до загибелі від 3,500,000 до 5,000,000 людей
    внаслідок сталінської політики встановлення високих квот на зерно та мізерних продовольчих норм.
  great-purge: >
    Під час Великої чистки, що тривала з 1936 по 1938 рік, сотні тисяч радянських громадян,
    підозрюваних у політичному інакомисленні, були страчені або ув’язнені.
    За оцінками, кількість загиблих становила від 700,000 до 1,200,000 осіб.
  vinnytsia-massacre: >
    У 1937-1938 роках радянський НКВС таємно стратив у Вінниці понад 9,400 осіб.
  nkvd-order-no-00439: >
    Наказ НКВС № 00439, виданий у 1937 році, призвів до арешту близько 800 громадян і колишніх громадян
    Німеччини та до винесення вироків приблизно 55,005 радянським громадянам німецького походження,
    з яких 41,898 осіб було засуджено до смертної кари.
  nkvd-order-no-00447: >
    Наказ НКВС № 00447 призвів до страти 386,798 радянських громадян до 1938 року.
  nkvd-order-no-00485: >
    Виданий у 1937 році наказ НКВС № 00485 започаткував кампанію етнічних чисток, спрямовану проти поляків;
    вона охопила 139,815 осіб, з яких 111,071 було засуджено до смертної кари без суду.
    Ця операція була частиною масштабніших «національних операцій», що стосувалися низки етнічних груп,
    зокрема німців, латишів, фінів, естонців, румунів, греків та інших.
  polish-operation-of-the-nkvd: >
    Наслідком Польської операції НКВС стало засудження 139,835 осіб і страта 111,091 поляка;
    операція була спрямована проти поляків та інших осіб, яких вважали нелояльними, і призвела до депортацій цілих родин
    та знищення польської меншини.
  deportation-of-koreans-in-the-soviet-union: >
    У 1937 році 172,000 радянських корейців були примусово переселені на відстань 6,400 км до Центральної Азії;
    до 50,000 із них загинули через суворі умови.
  stalinist-repressions-in-mongolia: >
    Сталінські репресії в Монголії у 1937-1939 роках призвели до страти від 20,000 до 35,000 осіб.
  1937-mass-execution-of-belarusians: >
    У жовтні 1937 року радянська влада стратила понад 100 представників білоруської інтелігенції.
    Було вбито 103 білоруси, а загалом у період із 1937 по 1938 рік жертвами масштабніших репресій стали понад 100,000 осіб.
  latvian-operation-of-the-nkvd: >
    Під час сталінської «Великої чистки» НКВС заарештував і стратив тисячі латишів - із 22,369 засуджених латишів
    16,573 було розстріляно, а культурні установи було ліквідовано.
  estonian-operation-of-the-nkvd: >
    Під час Великої чистки (1937-1938 роки) НКВС здійснив Естонську операцію, засудивши 5,680 осіб до різних покарань,
    4,672 з них було засуджено до смертної кари.
  finnish-operation-of-the-nkvd: >
    У ході «фінської операції» НКВС, що проводилася під час Великої чистки 1937-1938 років, радянських фінів
    заарештовували, депортували та страчували. Фіни становили 3% населення Карельської АРСР,
    але на них припадало понад 40% жертв Великого терору в цій республіці; із майже 6,200 засуджених фінів понад 4,700 було страчено.
  soviet-invasion-of-poland: >
    Радянське вторгнення до Польщі 17 вересня 1939 року призвело до захоплення в полон
    320,000 поляків і поклало початок кампанії масових переслідувань.
    У період між 1939 та 1941 роками радянський НКВС депортував сотні тисяч людей зі східних районів Польщі.
  katyn-massacre: >
    У 1940 році Радянська таємна поліція стратила майже 22,000 польських офіцерів та представників інтелігенції у Катині.
  soviet-deportations-from-bessarabia-and-northern-bukovina: >
    У період з 1940 по 1951 рік Радянський Союз депортував 46,000 осіб із
    Молдавської Радянської Соціалістичної Республіки.
  soviet-deportations-from-latvia: >
    Радянський уряд депортував близько 60,000 латвійців до віддалених і непридатних для життя районів Радянського Союзу.
  soviet-deportations-from-lithuania: >
    У період з 1941 по 1952 рік Радянський Союз примусово депортував до виправно-трудових таборів щонайменше 130,000 литовців,
    70% з яких становили жінки та діти. Близько 28,000 із цих депортованих загинули на засланні внаслідок тяжких умов життя.
  nkvd-prisoner-massacres-in-lviv: >
    У червні 1941 року, під час відступу радянських військ перед наступом німецьких сил,
    співробітники радянського НКВС жорстоко стратили у Львові від 3,500 до 7,000 в’язнів,
    серед яких були українці, поляки та євреї.
  nkvd-prisoner-massacre-in-lutsk: >
    23 червня 1941 року, під час наступу німецьких військ у ході Другої світової війни,
    радянський НКВС стратив близько 2,000 політичних в’язнів у Луцьку.
  anglo-soviet-invasion-of-iran: >
    Англо-радянське вторгнення до Ірану 1941 року призвело до загибелі та поранення понад
    200 цивільних осіб унаслідок бомбардувань.
  deportation-of-soviet-germans-1941-1942: >
    Під час Другої світової війни радянський уряд депортував до Сибіру й Казахстану щонайменше 846,340 німців
    із Надволжя та інших районів західної частини Радянського Союзу через побоювання щодо їхньої співпраці
    з нацистською Німеччиною; це призвело до загибелі 228,800 осіб.
  deportation-of-the-soviet-greeks: >
    У період між 1942 та 1949 роками сталінський режим примусово депортував із чорноморського
    узбережжя від 70,000 до 80,000 греків. Унаслідок цього загинуло щонайменше 15,000 осіб.
  deportation-of-the-karachays: >
    У листопаді 1943 року радянський уряд депортував майже 70,000 карачаївців, що призвело до загибелі щонайменше
    13,000 осіб. Попри те, що 20,000 карачаївців служили в Червоній армії, влада безпідставно звинуватила їх
    у співпраці з німецькими військами, наслідком чого стало їх примусове переселення до трудових таборів у Середній Азії.
  deportation-of-the-kalmyks: >
    У грудні 1943 року понад 93,000 калмиків були примусово депортовані до Сибіру за безпідставними звинуваченнями
    у співпраці з країнами Осі, що призвело до загибелі понад 16,000 осіб,
    попри те, що 23,000 калмиків служили в Червоній армії.
  operation-lentil-caucasus: >
    У 1944 році радянська влада примусово депортувала 496,000 чеченців та інгушів;
    від 123,000 до 200,000 із них загинули під час перевезення через суворі умови.
  deportation-of-the-balkars: >
    У 1944 році 37,713 балкарців були примусово депортовані з рідної землі за 1 день.
    Внаслідок дій радянської влади загинуло від 7,600 до 11,000 осіб, що становило 20-25% цієї етнічної групи.
  deportation-of-the-crimean-tatars: >
    У 1944 році радянська влада депортувала щонайменше 191,044 кримських татар, унаслідок чого майже
    8,000 осіб загинули під час перевезення, а ще десятки тисяч померли через тяжкі умови життя.
  deportation-of-the-meskhetian-turks: >
    У 1944 році від 92,307 до 94,955 турків-месхетинців були примусово депортовані до Середньої Азії,
    внаслідок чого загинуло до 50,000 осіб. Ця політика була частиною масштабнішого радянського плану
    з виселення мусульманських меншин із Кавказу, що залишило турків-месхетинців без громадянства та розпорошеними по 7 країнах.
  soviet-deportations-from-estonia: >
    У період з 1945 по 1953 рік понад 35,000 осіб, переважно жінок і дітей, було примусово депортовано з Естонії до віддалених районів Радянського Союзу;
    Європейський суд з прав людини визнав ці дії злочином проти людяності. Серед депортованих у 1949 році понад 70% становили жінки та діти віком до 16 років.
  soviet-annexation-of-transcarpathia: >
    Радянський Союз анексував Закарпаття, що спричинило еміграцію понад 120,000 осіб і переміщення близько 450,000 жителів із Чехословаччини.
  augustow-roundup: >
    Серпнева облава, проведена радянськими військами у 1945 році, призвела до арешту понад 2000 польських антикомуністів; 600 осіб було страчено.
  soviet-invasion-of-south-sakhalin: >
    Радянське вторгнення на Південний Сахалін призвело до втрат серед японських військових і цивільних осіб, що становили приблизно 5000–6000 осіб,
    а також до захоплення в полон близько 18 202 солдатів, яких відправили до трудових таборів у Сибіру.
    Крім того, щонайменше 100 000 японських цивільних осіб втекли, щоб уникнути радянського контролю.
  gegenmiao-massacre: >
    Під час радянського вторгнення до Маньчжурії в серпні 1945 року Червона армія вчинила різанину,
    вбивши понад 1,000 японських жінок і дітей у Гегенмяо. Їх розстрілювали, давили танками та
    кололи багнетами вже після того, як вони підняли білий прапор.
  operation-vistula: >
    У 1947 році, за згодою Радянського Союзу, було здійснено операцію Вісла - примусове переселення майже 150,000 українців та представників інших
    національностей із південно-східної Польщі до північних і західних регіонів країни з метою ліквідації підтримки Української повстанської армії.
    У період між 1945 і 1947 роками НКВС затримав понад 126,000 українців, а майже 32,000 осіб було вбито.
  operation-priboi: >
    Операція «Прибій» передбачала депортацію понад 90,000 осіб із країн Балтії до Сибіру у 1949 році, переважно жінок і дітей віком до 16 років,
    з метою сприяння колективізації та придушення опору. До 1950 року померло понад 4,000 депортованих, зокрема 2080 дітей.
  operation-north: >
    Операція «Північ», санкціонована Міністерством державної безпеки СРСР, призвела до примусової депортації 9,973 Свідків Єгови
    та членів їхніх сімей до Сибіру в 1951 році; там їх зарахували до категорії «спецпоселенців» і піддали жорстоким переслідуванням.
  operation-osen: >
    Операція «Осінь» 1951 року передбачала депортацію понад 20,000 осіб із Литви до віддалених районів СРСР.
  night-of-the-murdered-poets: >
    12 серпня 1952 року в Москві за сфабрикованими звинуваченнями у шпигунстві та державній зраді було страчено 13 радянських євреїв,
    серед яких були письменники, що писали мовою їдиш і належали до Єврейського антифашистського комітету.
  east-german-uprising-of-1953: >
    У повстанні 1953 року в Східній Німеччині взяли участь понад 1,000,000 людей у
    700 населених пунктах. Після придушення протестів радянськими військами загинуло понад 125 цивільних осіб.
  1956-georgian-demonstrations: >
    Радянська армія вбила щонайменше 21 особу та поранила 55 у відповідь на демонстрації в Грузії 1956 року.
  hungarian-revolution-of-1956: >
    Угорська революція 1956 року, що тривала 15 днів, була придушена радянськими військами 7 листопада 1956 року.
    Внаслідок цього загинуло 2,500 угорців і 700 радянських військовослужбовців. Повстання призвело до ув’язнення
    22,000 осіб і страти 229 людей, а майже чверть мільйона угорців залишили країну.
  ussr-anti-religious-campaign-1958-1964: >
    Під час антирелігійної кампанії Хрущова (1958-1964 рр.) було страчено понад 50,000 представників духовенства,
    а кількість діючих православних храмів скоротилася з понад 20,000 до 6,850 станом на 1972 рік.
  novocherkassk-massacre: >
    Унаслідок розстрілу в Новочеркаську, коли радянські війська відкрили вогонь по беззбройних демонстрантах
    загинуло 24 особи, а 87 отримали тяжкі поранення.
  soviet-afghan-war: >
    Радянсько-афганська війна, що тривала з 1979 по 1989 рік, призвела до загибелі від 1,000,000 до 3,000,000 афганців та переміщення 5,500,000
    біженців. Радянські війська чинили численні звірства, зокрема цілеспрямовано атакували цивільне населення та руйнували інфраструктуру.
  rauzdi-massacre: >
    30 червня 1983 року в афганському селищі Раузді радянська армія вбила 24 особи, зокрема 23 цивільних,
    у відповідь на сутичку з 18-річним учасником антикомуністичного руху опору.
  kulchabat-bala-karz-and-mushkizi-massacre: >
    Радянська армія вбила до 360 мирних жителів, зокрема 20 дівчат і понад десяток літніх людей,
    у 3 афганських селах як захід у відповідь на знищення радянської військової техніки.
    Очевидці повідомляли про жорстокі вбивства, зокрема про випадки, коли гранати кидали в приміщення,
    де перебували жінки й діти.
  kunduz-massacre: >
    Під час різанини в Кундузі радянська армія вбила близько 250 мирних жителів у відповідь на опір моджахедів.
    Ці звірства супроводжувалися грабежами, руйнуваннями, зґвалтуваннями та систематичними стратами селян.
  laghman-massacre: >
    Під час різанини в Лагмані радянські війська вбили від 500 до 1,000 мирних жителів, застосувавши напалмові бомби.
  black-january: >
    У січні 1990 року радянські війська увійшли до Баку для придушення антирадянських і антивірменських настроїв,
    що призвело до загибелі 147 цивільних осіб і поранення 800.
