lead: >
  Російська Федерація зберігає імперські амбіції [Радянського Союзу](/ua/soviet_crimes/).
  Вона продовжує свій жахливий завойовницький наступ проти
  [осетинів](#south-ossetia-war-1991-1992),
  [чеченців](#second-chechen-war),
  [грузинів](#russo-georgian-war)
  та [українців](#russo-ukrainian-war),
  вчиняючи
  [масові вбивства](#izium-mass-graves),
  [страти](#novye-aldi-massacre),
  [катування](#bucha-massacre),
  спрямовані проти
  [військовополонених](#olenivka-prison-massacre)
  та [цивільних](#siege-of-mariupol).
closer: >
  Дивися також: злочини [__Російської імперії__](/ua/empire_crimes/), злочини [__Радянського Союзу__](/ua/soviet_crimes/).
entries:
  south-ossetia-war-1991-1992: >
    Війна в Південній Осетії 1991-1992 років за участю підтримуваних Росією
    осетинських сепаратистів призвела до загибелі близько 1,000 осіб і переміщення понад 63,000 людей.
  battle-of-grozny-1994-1995: >
    Російське вторгнення до Грозного, що тривало з грудня 1994 року по березень 1995 року,
    супроводжувалося масованими артилерійськими обстрілами та авіаударами, що призвело до
    значних втрат серед цивільного населення. За оцінками, загинуло від 5,000 до 30,000 осіб.
  samashki-massacre: >
    У квітні 1995 року російські війська вбили понад 100 мирних жителів у Самашках,
    розстрілюючи та спалюючи їх живцем, а також знищили село, зокрема й школу.
  second-chechen-war: >
    Під час Другої чеченської війни (1999-2009 рр.) російські війська застосовували заборонену зброю та здійснювали
    безрозбірні напади на цивільне населення, що призвело до загибелі до 25,000 мирних жителів і зникнення безвісти 5,000 осіб.
  1999-russian-apartment-bombings: >
    Унаслідок вибухів у житлових будинках у Росії 1999 року загинуло понад 300 осіб, а понад 1,000 зазнали поранень.
    Ці події посіяли страх, що слугував виправданням для розгортання Другої чеченської війни в очах цивільного населення.
    Незалежні розслідування вказують на те, що російські спецслужби організували ці напади,
    аби загострити конфлікт і підвищити популярність Путіна.
  battle-of-grozny-1999-2000: >
    Під час битви за Грозний (1999-2000 роки) місто зазнало масованих російських бомбардувань,
    внаслідок чого його визнали найбільш зруйнованим містом на Землі.
    Загинуло від 5,000 до 8,000 цивільних осіб, також мали місце грубі порушення прав людини.
  bombing-of-katyr-yurt: >
    4 лютого 2000 року російські війська завдали бомбових ударів по селу Катир-Юрт і колоні біженців,
    унаслідок чого загинуло щонайменше 363 цивільні особи.
  novye-aldi-massacre: >
    5 лютого 2000 року під час «зачистки» в Нових Алдах російські війська стратили до 82 мирних жителів.
    Ці дії супроводжувалися мародерством, зґвалтуваннями та підпалами.
  komsomolskoye-massacre: >
    Під час різанини в Комсомольському близько 72 чеченських бійців, які здалися в полон,
    були майже повністю знищені або зникли після затримання та катувань.
  moscow-theater-hostage-crisis: >
    Захоплення заручників у московському театрі, під час якого 40 чеченських терористів утримували 912 осіб,
    завершилося загибеллю 132 заручників після того, як російські сили застосували нерозкриту хімічну речовину.
  beslan-school-siege: >
    Захоплення школи в Беслані, що тривало 3 дні у 2004 році, охопило понад 1,100 заручників,
    зокрема 777 дітей, і призвело до загибелі 334 осіб, серед яких 186 дітей.
  russo-georgian-war: >
    Російсько-грузинська війна 2008 року, розв’язана Росією, призвела до переміщення
    192,000 осіб і численних жертв серед цивільного населення.
  russo-ukrainian-war: >
    Російське вторгнення в Україну розпочалося в лютому 2014 року й триває досі. За оцінками,
    загальна кількість постраждалих становить від 1,274,000 до 2,000,000 осіб,
    серед яких щонайменше 20,000 загиблих і 50,000 поранених цивільних.
  malaysia-airlines-flight-17: >
    Рейс 17 авіакомпанії Malaysia Airlines було збито ракетою комплексу «Бук», випущеною з установки, пов’язаної
    з підтримуваними Росією сепаратистами на сході України. Унаслідок цього загинули всі 298 пасажирів і членів екіпажу.
  battle-of-debaltseve: >
    Битва за Дебальцеве, що стала частиною війни на Донбасі, призвела до загибелі понад 267 українських військових
    і тяжких гуманітарних наслідків. Після завершення боїв було виявлено тіла майже 500 цивільних осіб.
  siege-of-mariupol: >
    Російська облога Маріуполя тривала майже 3 місяці й призвела до окупації міста та
    загибелі щонайменше 1,348 цивільних осіб. За оцінками, реальна кількість жертв на тисячі більша.
    Облога також спричинила руйнування 90% житлового фонду міста, тоді як російські
    війська блокували доставку гуманітарної допомоги, вчиняючи численні воєнні злочини.
  bombing-of-borodianka: >
    1–2 березня 2022 року російські авіаудари зруйнували 8 багатоповерхових житлових будинків
    у Бородянці, внаслідок чого загинули 40–80 цивільних осіб.
  kharkiv-government-building-airstrike: >
    1 березня 2022 року дві російські крилаті ракети влучили в будівлю Харківської обласної
    державної адміністрації та прилеглу площу Свободи, внаслідок чого загинули 29 людей і понад 35
    були поранені.
  3-march-2022-chernihiv-bombing: >
    3 березня 2022 року російська авіація завдала бомбового удару по житловому кварталу в Чернігові, внаслідок чого загинуло
    47 і було поранено 18 осіб, тоді як цивільні мешканці займалися своїми повсякденними справами.
  irpin-refugee-column-shelling: >
    6 березня 2022 року російські війська неодноразово обстрілювали перехрестя в Ірпіні, яким користувалися цивільні особи,
    що тікали до Києва, вбивши 8 осіб.
  9-march-2022-mariupol-hospital-3-attack: >
    9 березня 2022 року російські війська розбомбили пологовий будинок № 3 у Маріуполі,
    внаслідок чого загинули щонайменше 4 особи, а ще щонайменше 16 отримали поранення.
  bucha-massacre: >
    Різанина в Бучі супроводжувалася масовими вбивствами українських цивільних російськими військами; було виявлено 458 тіл,
    зокрема дев’ятьох дітей. ООН задокументувала щонайменше 73 випадки незаконних убивств, а організація
    Human Rights Watch підтвердила факти скоєння російськими військами воєнних злочинів, зокрема страт і катувань.
  stara-krasnianka-care-house-attack: >
    11 березня 2022 року пов'язані з Росією сили обстріляли важким озброєнням пансіонат у
    Старій Краснянці, де всередині перебували 71 пацієнт з інвалідністю та 15 працівників.
    Після цього виникла пожежа, внаслідок якої загинули 56 цивільних осіб.
  16-march-2022-chernihiv-breadline-attack: >
    16 березня 2022 року російські війська атакували цивільних, які стояли в черзі по хліб у Чернігові, вбивши 18 і поранивши 26 осіб.
  mariupol-theatre-airstrike: >
    16 березня 2022 року Збройні сили Росії завдали авіаудару по театру в Маріуполі,
    який слугував укриттям для цивільних осіб, що призвело до загибелі до 600 людей.
  mykolaiv-government-building-missile-strike: >
    29 березня 2022 року російські сили запустили крилату ракету по будівлі Миколаївської обласної
    державної адміністрації, зруйнувавши приблизно половину споруди та спричинивши пожежі.
    Внаслідок удару загинули 37 людей і 34 були поранені.
  kramatorsk-railway-station-attack: >
    8 квітня 2022 року внаслідок російського ракетного удару по залізничному вокзалу Краматорська
    загинули 63 цивільні особи, зокрема 9 дітей, а 150 отримали поранення.
  bilohorivka-school-bombing: >
    7 травня 2022 року російські сили завдали авіаудару по школі в Білогорівці, де в підвалі
    переховувалися близько 90 людей. Удар спричинив пожежу та заблокував людей усередині.
    Загинули до 60 цивільних осіб.
  kremenchuk-shopping-mall-attack: >
    27 червня 2022 року російські ракети влучили в торговельний центр у Кременчуці,
    внаслідок чого загинули щонайменше 20 людей, а 59 отримали поранення.
  serhiivka-missile-strike: >
    Унаслідок російського ракетного удару по Сергіївці 1 липня 2022 року загинула щонайменше 21 цивільна особа,
    а 38 осіб, серед яких 6 дітей, зазнали поранень.
  july-2022-chasiv-yar-missile-strike: >
    9 липня 2022 року російські війська обстріляли ракетами з РСЗВ «Ураган» житлові будинки в Часовому Яру,
    внаслідок чого загинули щонайменше 48 людей.
  vinnytsia-strikes-2022-present: >
    14 липня 2022 року російські військово-морські сили випустили ракети «Калібр» по центру Вінниці,
    влучивши в медичний центр і Будинок офіцерів, унаслідок чого загинуло понад 28
    і було поранено понад 202 цивільних осіб.
  olenivka-prison-massacre: >
    Російські війська обстріляли українську в’язницю в Оленівці, вбивши 53 українських військовополонених
    і поранивши від 75 до 130 осіб. Незалежні розслідування вказують на відповідальність Росії,
    а сама Росія відмовляється співпрацювати з розслідуваннями ООН.
  kharkiv-dormitories-missile-strike: >
    17–18 серпня 2022 року російські сили завдали ракетних ударів по житлових гуртожитках
    у Харкові, внаслідок чого загинули 25 людей і 44 були поранені.
  chaplyne-railway-station-attack: >
    24 серпня 2022 року російські сили завдали ракетного удару по Чаплиному, внаслідок чого
    загинули 25 людей і 31 людина була поранена.
  izium-mass-graves: >
    Після того, як українські сили повернули контроль над Ізюмом під час Харківського контрнаступу,
    у місцях масових поховань було виявлено 447 тіл, зокрема 414 цивільних (215 жінок, 194 чоловіки, 5 дітей) та 22 військовослужбовців.
  kupiansk-civilian-convoy-shelling: >
    25 вересня 2022 року російські військові атакували колону цивільних, що евакуювалася поблизу Куп’янська.
    26 людей загинули, а 22 вдалося врятуватися під час втечі з міста.
  zaporizhzhia-civilian-convoy-attack: >
    30 вересня 2022 року російські війська завдали ракетного удару по цивільній колоні поблизу Запоріжжя,
    коли люди збиралися для виїзду на окуповану Росією територію, внаслідок чого загинули 32 особи, а близько 88 отримали поранення.
  2022-zaporizhzhia-residential-building-airstrike: >
    9 жовтня 2022 року російські війська завдали ракетного удару по житловому кварталу Запоріжжя,
    зруйнувавши багатоквартирний будинок. 13 людей загинули, а 89 отримали поранення.
  2023-dnipro-residential-building-airstrike: >
    14 січня 2023 року російські війська завдали удару ракетою Х-22 по 9-поверховому житловому будинку в Дніпрі,
    внаслідок чого загинули 46 і зазнали поранень 80 цивільних осіб.
  april-2023-sloviansk-airstrike: >
    14 квітня 2023 року, у Страсну п’ятницю за православним календарем, російські ракети влучили в житлові будинки у Слов’янську,
    внаслідок чого загинуло 15 цивільних осіб, зокрема дитина, а 24 особи дістали поранення.
  2023-uman-missile-strike: >
    28 квітня 2023 року російські війська завдали удару крилатою ракетою Х-101 по житловому будинку в Умані,
    внаслідок чого загинули 23 цивільні особи, а ще 9 зазнали поранень.
  destruction-of-the-kakhovka-dam: >
    6 червня 2023 року російські війська зруйнували Каховську дамбу, що спричинило катастрофічну повінь униз за течією.
    Офіційно повідомлялося про загибель щонайменше 59 осіб, а загальна кількість жертв може сягати сотень.
  2023-kramatorsk-restaurant-missile-strike: >
    27 червня 2023 року російські війська випустили 2 ракети по Краматорську, влучивши в переповнений цивільний ресторан;
    загинуло 13 людей, зокрема 4 дітей, а 65 отримали поранення.
  lyman-cluster-bombing: >
    8 липня 2023 року російські війська застосували касетні боєприпаси РСЗВ «Смерч» проти житлового кварталу в центрі Лимана,
    внаслідок чого загинуло 9 і було поранено 13 цивільних осіб.
  2023-pokrovsk-missile-strike: >
    7 серпня 2023 року російські війська двічі завдали удару по Покровську ракетами «Іскандер»,
    внаслідок чого загинуло 10 осіб, а 88 отримали поранення, зокрема й рятувальники, які прибули на місце першого влучання.
  august-2023-chernihiv-missile-strike: >
    19 серпня 2023 року російська ракета «Іскандер-М» влучила в центр Чернігова поблизу театру імені Тараса Шевченка,
    де саме проходила виставка за участю цивільних; унаслідок удару загинуло 7 осіб, а понад 144 дістали поранення.
  hroza-missile-attack: >
    5 жовтня 2023 року російська ракета «Іскандер» влучила в кафе в селі Гроза під час поминального зібрання
    за українським військовим, унаслідок чого загинули 59 цивільних осіб, а семеро зазнали поранень.
  volnovakha-massacre: >
    27 жовтня 2023 року двоє російських військовослужбовців, за повідомленнями, увійшли до будинку
    цивільної родини в окупованій Волновасі та вбили всіх 9 членів родини Капканець, зокрема дітей
    віком 5 і 9 років. Як повідомляється, жертв застрелили після того, як вони відмовилися
    передати свій будинок для використання російським військовим підрозділом.
  2024-pokrovsk-missile-strike: >
    6 січня 2024 року російські війська завдали ракетного удару по житловому району Покровська,
    внаслідок чого загинули 12 людей (зокрема 6 дітей) і ще 10 дістали поранення.
  15-march-2024-odesa-missile-strikes: >
    15 березня 2024 року російські війська завдали ударів по Одесі, внаслідок чого загинула 21 особа,
    а 74 дістали поранення.
  25-may-2024-kharkiv-missile-strikes: >
    25 травня 2024 року російські війська завдали удару по Харкову, зокрема по гіпермаркету «Епіцентр К»,
    внаслідок чого загинуло 19 осіб, а понад 65 отримали поранення.
  8-july-2024-russian-strikes-on-ukraine: >
    8 липня 2024 року внаслідок російських ударів по всій території України загинуло 47 осіб,
    а близько 170 зазнали поранень; одна з ракет влучила в дитячу лікарню «Охматдит» у Києві.
  september-2024-poltava-strike: >
    3 вересня 2024 року російські ракети влучили у військовий інститут і лікарню в Полтаві,
    внаслідок чого загинули щонайменше 59 осіб, а 328 отримали поранення.
  2025-sumy-airstrike: >
    13 квітня 2025 року російські балістичні ракети вдарили по центру Сум під час релігійних відправ,
    унаслідок чого загинули 35 осіб (зокрема 2 дітей) і постраждали 129 (серед яких 15 дітей).
  2025-yarova-attack: >
    9 вересня 2025 року російські війська завдали удару керованою авіабомбою по селищу Ярова в той момент,
    коли пенсіонери зібралися для отримання пенсій. Загинуло 25 осіб, а 19 дістали поранення.
  2025-ternopil-strike: >
    19 листопада 2025 року російські сили здійснили масштабну комбіновану ракетно-дронову
    атаку на Тернопіль, завдавши ударів по житлових районах і двох багатоквартирних будинках.
    Внаслідок атаки загинули щонайменше 38 цивільних осіб, зокрема 8 дітей, і 99 людей були поранені.
